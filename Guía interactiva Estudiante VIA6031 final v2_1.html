ab=\"1\">\u003cspan class=\"n\">02\u003c/span>Instrucciones\u003cspan class=\"done\">\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"2\">\u003cspan class=\"n\">03\u003c/span>Conjunto de datos\u003cspan class=\"done\">\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"3\">\u003cspan class=\"n\">04\u003c/span>Laboratorio\u003cspan class=\"done\">\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"4\">\u003cspan class=\"n\">05\u003c/span>Contraste con el conjunto\u003cspan class=\"done\">\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"5\">\u003cspan class=\"n\">06\u003c/span>Ficha y descarga\u003cspan class=\"done\">\u003c/span>\u003c/button>\n  \u003c/nav>\n\u003c/header>\n\n\u003cmain>\n\u003c!-- ================= 01 FUNDAMENTO ================= -->\n\u003csection class=\"panel active\" data-panel=\"0\">\n  \u003cdiv class=\"eyebrow\">Carpeta pedagógica · Laboratorio de exploración\u003c/div>\n  \u003ch1 class=\"title\">Laboratorio de Exploración de Datos Educativos con Orange\u003c/h1>\n  \u003cp class=\"lede\">Antes de modelar, hay que mirar. Este laboratorio entrega un conjunto de datos educativos deliberadamente imperfecto y pide recorrer con Orange el ciclo completo de una exploración inicial: importar, reconocer las variables, detectar faltantes e inconsistencias, visualizar, describir patrones y, sobre todo, distinguir qué información apoya una decisión educativa de qué conclusiones no pueden extraerse de esos datos. La actividad no tiene valor en la calificación: su producto es una \u003cstrong>Ficha de Exploración e Interpretación de Datos Educativos\u003c/strong>.\u003c/p>\n\n  \u003cdiv class=\"card accent\" style=\"margin-bottom:26px;\">\n    \u003cdiv class=\"label\">Pregunta orientadora\u003c/div>\n    \u003cp class=\"hero-q\">\"¿Qué dicen realmente estos datos, qué les falta, qué decisión pueden iluminar y qué conclusión sería un abuso de lo que contienen?\"\u003c/p>\n  \u003c/div>\n\n  \u003ch2>Cinco lentes para explorar antes de concluir\u003c/h2>\n  \u003cdiv class=\"stack\">\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">1\u003c/div>\u003cdiv>\n      \u003ch3>El análisis exploratorio como actitud, no como técnica\u003c/h3>\n      \u003cdiv class=\"cite\">Tukey (1977) · Wickham y Grolemund (2017)\u003c/div>\n      \u003cp>Tukey propuso el análisis exploratorio de datos como una fase de \"detective\": mirar antes de confirmar, dejar que los datos sugieran preguntas, resistir la tentación de aplicar un modelo antes de entender la forma de las variables. Wickham y Grolemund lo convierten en un ciclo iterativo —importar, ordenar, transformar, visualizar, modelar, comunicar— en el que visualizar y transformar se repiten muchas veces antes de modelar. Orange materializa ese ciclo en un flujo visual de widgets.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Pasos 1, 2 y 4 · Importar, variables, visualizar\u003c/b>Cada visualización debe nacer de una pregunta (\"¿cómo se distribuye la nota final según el estado?\") y no del catálogo de widgets.\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">2\u003c/div>\u003cdiv>\n      \u003ch3>La calidad de los datos se audita, no se asume\u003c/h3>\n      \u003cdiv class=\"cite\">Romero y Ventura (2020) · Siemens (2013)\u003c/div>\n      \u003cp>Los registros educativos provienen de sistemas distintos (LMS, registro académico, encuestas) con convenciones distintas: un mismo valor escrito de tres formas, identificadores repetidos, campos vacíos que no son neutros. Un valor faltante en \"nota final\" puede significar que el estudiante abandonó, que el docente no cargó la nota o que el curso no terminó: tres realidades que un promedio borra. La minería de datos educativos dedica buena parte del esfuerzo a esta limpieza y la documenta como parte del análisis.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Paso 3 · Faltantes e inconsistencias\u003c/b>Para cada problema detectado decide y registra: eliminar, corregir, marcar como faltante o conservar y documentar. La decisión también es un dato de la ficha.\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">3\u003c/div>\u003cdiv>\n      \u003ch3>Visualizar para ver, no para decorar\u003c/h3>\n      \u003cdiv class=\"cite\">Cairo (2016) · Few (2012)\u003c/div>\n      \u003cp>Una visualización honesta muestra la distribución completa —no solo el promedio—, declara su escala y sus faltantes, y elige el tipo de gráfico según el tipo de variable y la pregunta: histogramas y diagramas de caja para distribuciones, dispersión para relaciones entre dos numéricas, barras para comparar categorías. Cairo insiste en que el gráfico es una afirmación: puede ser verdadera, engañosa o vacía.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Paso 4 · Al menos dos visualizaciones\u003c/b>Documenta para cada una el widget, las variables, lo que muestra y lo que no muestra. El laboratorio genera una referencia con el mismo conjunto para contrastar.\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">4\u003c/div>\u003cdiv>\n      \u003ch3>Del patrón a la decisión educativa\u003c/h3>\n      \u003cdiv class=\"cite\">Siemens (2013) · Arnold y Pistilli (2012)\u003c/div>\n      \u003cp>La analítica del aprendizaje tiene valor cuando un patrón se traduce en una decisión que alguien puede tomar: a quién acompañar primero, qué curso rediseñar, qué registro corregir, qué pregunta hacer después. Un hallazgo que no cambia ninguna acción es, a lo sumo, interesante. La pregunta \"¿qué decisión apoya?\" obliga también a precisar quién decide y con qué otra información.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Pasos 5 y 6 · Patrones y decisiones\u003c/b>Describe el patrón con sus números (cuántos, qué proporción, en qué grupo) y conecta cada decisión con el patrón que la justifica.\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">5\u003c/div>\u003cdiv>\n      \u003ch3>Los límites de la inferencia\u003c/h3>\n      \u003cdiv class=\"cite\">Kitchin (2014) · Baker y Hawn (2022) · Slade y Prinsloo (2013)\u003c/div>\n      \u003cp>Un conjunto de datos describe una cohorte en un momento, con las variables que alguien decidió registrar. No establece causas (que quienes estudian más horas tengan mejores notas no implica que aumentar las horas mejore la nota), no predice individuos sin un modelo validado, no representa a quienes no respondieron y no mide lo que no se registró. Kitchin advierte contra el \"empirismo\" que supone que los datos hablan solos; Baker y Hawn muestran cómo esas lecturas ingenuas reproducen desigualdades.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Paso 7 · Lo que no se puede concluir\u003c/b>Nombrar explícitamente lo que estos datos no permiten afirmar es parte del producto, no una debilidad del análisis.\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\n  \u003ch2 style=\"margin-top:28px;\">Referencias de la carpeta\u003c/h2>\n  \u003cdiv class=\"card refs\">\u003cul id=\"refsList\">\u003c/ul>\u003c/div>\n  \u003cdiv class=\"nav-row\">\u003cspan>\u003c/span>\u003cbutton class=\"pill-btn primary goto\" data-goto=\"1\">Instrucciones →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 02 INSTRUCCIONES ================= -->\n\u003csection class=\"panel\" data-panel=\"1\">\n  \u003cdiv class=\"eyebrow\">Instrucciones de uso\u003c/div>\n  \u003ch1 class=\"title\">Cómo se recorre el laboratorio\u003c/h1>\n  \u003cp class=\"lede\">Necesitas \u003cstrong>Orange Data Mining\u003c/strong> instalado (gratuito, orangedatamining.com). El laboratorio entrega el archivo de datos y un flujo de inicio; tú trabajas en Orange y registras aquí lo que encuentras. Como el laboratorio conoce el conjunto, puede contrastar tus hallazgos —número de filas, faltantes, inconsistencias, patrones— y generar visualizaciones de referencia con los mismos datos para que compares con tus widgets.\u003c/p>\n  \u003cdiv class=\"grid g2\" style=\"margin-bottom:18px;\">\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"label\">Los siete pasos\u003c/div>\n      \u003cdiv class=\"flow-strip\">\u003cspan class=\"fs\">1 Importar\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">2 Variables\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">3 Faltantes e inconsistencias\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">4 Visualizaciones\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">5 Patrones\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">6 Decisión educativa\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">7 Límites\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card accent\">\n      \u003cdiv class=\"label\">Valor: 0 %\u003c/div>\n      \u003cp style=\"margin:0; font-size:13.5px; color:var(--ink);\">La actividad no se califica. El contraste que ofrece el laboratorio es \u003cstrong>formativo\u003c/strong>: te dice si tu lectura coincide con lo que hay en el conjunto y por qué. La Ficha es la evidencia de que recorriste el proceso con criterio.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-bottom:18px;\">\n    \u003cdiv class=\"label\">Pasos\u003c/div>\n    \u003col class=\"steps\">\n      \u003cli>\u003cb>Lee el fundamento\u003c/b> (01) y ten a mano la pregunta orientadora.\u003c/li>\n      \u003cli>\u003cb>Descarga el conjunto de datos y el flujo\u003c/b> (03). Lee el diccionario de variables: es intencionalmente incompleto en algunos puntos.\u003c/li>\n      \u003cli>\u003cb>Abre Orange\u003c/b> y carga el flujo \u003cspan class=\"mono\">Flujo_Exploracion_ValleAzul.ows\u003c/span> (o construye uno: \u003cspan class=\"mono\">File → Data Table / Feature Statistics / Distributions / Box Plot / Scatter Plot\u003c/span>). En el widget \u003cspan class=\"mono\">File\u003c/span> selecciona el archivo CSV.\u003c/li>\n      \u003cli>\u003cb>Recorre los siete pasos\u003c/b> (04). Cada paso indica qué widget usar y qué registrar. Guarda lecturas breves y precisas: con cifras.\u003c/li>\n      \u003cli>\u003cb>Contrasta\u003c/b> (05) tus hallazgos con el conjunto y revisa las visualizaciones de referencia.\u003c/li>\n      \u003cli>\u003cb>Completa y descarga la Ficha\u003c/b> (06).\u003c/li>\n    \u003c/ol>\n  \u003c/div>\n  \u003cdiv class=\"grid g3\">\n    \u003cdiv class=\"card tight\">\u003cdiv class=\"label\">Guardado\u003c/div>\u003cp style=\"margin:0; font-size:13px; color:var(--ink);\">El avance se guarda en este navegador. \"Reiniciar\" borra todo tras confirmar.\u003c/p>\u003c/div>\n    \u003cdiv class=\"card tight\">\u003cdiv class=\"label\">Duración estimada\u003c/div>\u003cp style=\"margin:0; font-size:13px; color:var(--ink);\">90 a 120 minutos con Orange abierto; puede hacerse en varias sesiones.\u003c/p>\u003c/div>\n    \u003cdiv class=\"card tight warn\">\u003cdiv class=\"label\">Sin Orange\u003c/div>\u003cp style=\"margin:0; font-size:13px; color:var(--ink);\">Puedes completar los pasos con las visualizaciones de referencia del laboratorio, pero la actividad pide hacerlo en Orange.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"nav-row\">\u003cbutton class=\"pill-btn goto\" data-goto=\"0\">← Fundamento\u003c/button>\u003cbutton class=\"pill-btn primary goto\" data-goto=\"2\">Ver el conjunto de datos →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 03 DATOS ================= -->\n\u003csection class=\"panel\" data-panel=\"2\">\n  \u003cdiv class=\"eyebrow\">Conjunto de datos\u003c/div>\n  \u003ch1 class=\"title\">Instituto Superior Valle Azul · Cohorte de seguimiento académico\u003c/h1>\n  \u003cp class=\"lede\">La Dirección de Educación Virtual exportó un corte de \u003cstrong>240 registros\u003c/strong> de estudiantes de cuatro programas, combinando el LMS, el sistema académico y la encuesta semestral. Quiere saber \"qué se ve\" antes de encargar cualquier modelo. El conjunto es ficticio, pero reproduce defectos reales de los datos institucionales: valores vacíos, etiquetas escritas de varias formas, registros imposibles y una encuesta que casi nadie respondió.\u003c/p>\n  \u003cdiv class=\"grid g3\" style=\"margin-bottom:18px;\">\n    \u003cdiv class=\"card tight\">\u003cdiv class=\"label\">Archivo de datos\u003c/div>\u003cp style=\"margin:0 0 10px; font-size:13px; color:var(--ink);\">CSV, separado por comas, codificación UTF-8, 16 columnas. Los vacíos son celdas en blanco.\u003c/p>\u003cbutton class=\"pill-btn primary\" id=\"btnCsv\">Descargar Datos_Exploracion_ValleAzul.csv\u003c/button>\u003c/div>\n    \u003cdiv class=\"card tight\">\u003cdiv class=\"label\">Flujo de inicio para Orange\u003c/div>\u003cp style=\"margin:0 0 10px; font-size:13px; color:var(--ink);\">Seis widgets conectados. Al abrirlo, selecciona el CSV en el widget File. Si algún widget no se reconoce en tu versión, agrégalo desde el panel lateral.\u003c/p>\u003cbutton class=\"pill-btn\" id=\"btnOws\">Descargar Flujo_Exploracion_ValleAzul.ows\u003c/button>\u003c/div>\n    \u003cdiv class=\"card tight warn\">\u003cdiv class=\"label\">Lo que no dice el diccionario\u003c/div>\u003cp style=\"margin:0; font-size:13px; color:var(--ink);\">Por qué faltan notas finales, qué significa una hora negativa, cómo se registró la modalidad. Parte del trabajo es formular esas preguntas.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003ch2>Diccionario de variables\u003c/h2>\n  \u003cdiv class=\"card\" style=\"margin-bottom:22px;\">\u003cdiv class=\"mtx-wrap\">\u003ctable class=\"dict\" id=\"dictTable\">\u003c/table>\u003c/div>\u003c/div>\n  \u003ch2>Vista previa\u003c/h2>\n  \u003cp class=\"muted\" style=\"margin:0 0 12px; font-size:14px;\">Primeras 25 filas, tal como las verás en el widget Data Table. Los vacíos aparecen como \"?\" en Orange.\u003c/p>\n  \u003cdiv class=\"preview\" id=\"previewTable\">\u003c/div>\n  \u003cdiv class=\"nav-row\">\u003cbutton class=\"pill-btn goto\" data-goto=\"1\">← Instrucciones\u003c/button>\u003cbutton class=\"pill-btn primary goto\" data-goto=\"3\">Ir al laboratorio →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 04 LABORATORIO ================= -->\n\u003csection class=\"panel\" data-panel=\"3\">\n  \u003cdiv class=\"eyebrow\">Laboratorio\u003c/div>\n  \u003ch1 class=\"title\">Siete pasos con Orange\u003c/h1>\n  \u003cdiv class=\"stepper\" id=\"stepper\">\u003c/div>\n  \u003cdiv id=\"labBody\">\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 05 CONTRASTE ================= -->\n\u003csection class=\"panel\" data-panel=\"4\">\n  \u003cdiv class=\"eyebrow\">Contraste con el conjunto\u003c/div>\n  \u003ch1 class=\"title\">Lo que registraste frente a lo que contiene el conjunto\u003c/h1>\n  \u003cp class=\"lede\">El laboratorio compara tus registros con los valores reales del archivo y con una lectura de referencia de los patrones. No es una calificación: es la forma de saber si tu exploración vio lo que había.\u003c/p>\n  \u003cdiv class=\"grid g3\" style=\"margin-bottom:22px;\" id=\"kpis\">\u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-bottom:22px;\">\u003cdiv class=\"label\">Verificaciones\u003c/div>\u003cdiv id=\"checks\">\u003c/div>\u003c/div>\n  \u003ch2>Visualizaciones de referencia\u003c/h2>\n  \u003cp class=\"muted\" style=\"margin:0 0 12px; font-size:14px;\">Generadas con el mismo conjunto. Compáralas con tus widgets: si tu gráfico se ve distinto, revisa variables, filtros y el tratamiento de los faltantes.\u003c/p>\n  \u003cdiv class=\"grid g2\" id=\"refCharts\">\u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-top:22px;\">\u003cdiv class=\"label\">Hallazgos de referencia\u003c/div>\u003cdiv id=\"findings\" style=\"font-size:13.5px; line-height:1.7; color:var(--ink);\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"nav-row\">\u003cbutton class=\"pill-btn goto\" data-goto=\"3\">← Laboratorio\u003c/button>\u003cbutton class=\"pill-btn primary goto\" data-goto=\"5\">Preparar la Ficha →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 06 FICHA ================= -->\n\u003csection class=\"panel\" data-panel=\"5\">\n  \u003cdiv class=\"eyebrow\">Ficha de Exploración e Interpretación de Datos Educativos\u003c/div>\n  \u003ch1 class=\"title\">Completa y descarga tu Ficha\u003c/h1>\n  \u003cp class=\"lede\">La Ficha reúne, en ocho apartados, lo que registraste en los siete pasos: conjunto, variables, calidad, visualizaciones (con las referencias generadas), patrones, decisión educativa, límites de inferencia y una reflexión final. Se descarga como archivo .html listo para entregar.\u003c/p>\n  \u003cdiv class=\"grid g2\" style=\"margin-bottom:18px;\">\n    \u003cdiv class=\"card\">\u003cdiv class=\"grid\" style=\"gap:12px;\">\n      \u003cdiv class=\"field\">\u003cspan class=\"fl\">Nombre del maestrante\u003c/span>\u003cinput type=\"text\" data-ref=\"nombre\" placeholder=\"Nombre y apellido\">\u003c/div>\n      \u003cdiv class=\"field\">\u003cspan class=\"fl\">Programa / cohorte (opcional)\u003c/span>\u003cinput type=\"text\" data-ref=\"programa\" placeholder=\"Ej.: Maestría en ... — cohorte ...\">\u003c/div>\n      \u003cdiv class=\"field\">\u003cspan class=\"fl\">Reflexión final · ¿qué aprendiste sobre mirar datos antes de modelar?\u003c/span>\u003ctextarea data-ref=\"reflexion\" placeholder=\"Cuatro a ocho líneas.\">\u003c/textarea>\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003cdiv class=\"label\">Estado de la Ficha\u003c/div>\u003cdiv id=\"checklist\" style=\"font-size:13.5px; line-height:1.9;\">\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card ficha\" style=\"margin-bottom:18px;\" id=\"fichaPreview\">\u003c/div>\n  \u003cdiv class=\"row\">\n    \u003cbutton cl /div>\n      \u003cspan class=\"tag\">Semana 6 · Laboratorio de Ingeniería de Prompts para una Necesidad Educativa\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"top-actions\">\n      \u003cbutton class=\"pill-btn\" id=\"btnReset\" title=\"Borrar todo el trabajo y empezar de nuevo\">Reiniciar\u003c/button>\n      \u003cbutton class=\"pill-btn primary\" id=\"btnDownloadTop\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3v12\"/>\u003cpolyline points=\"6 11 12 17 18 11\"/>\u003cpath d=\"M4 21h16\"/>\u003c/svg>Informe\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cnav class=\"tabs\" id=\"tabs\">\n    \u003cbutton class=\"tab active\" data-tab=\"0\">\u003cspan class=\"n\">01\u003c/span>Fundamento teórico\u003cspan class=\"done\">\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"1\">\u003cspan class=\"n\">02\u003c/span>Instrucciones\u003cspan class=\"done\">\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"2\">\u003cspan class=\"n\">03\u003c/span>Necesidad educativa\u003cspan class=\"done\">\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"3\">\u003cspan class=\"n\">04\u003c/span>Laboratorio\u003cspan class=\"done\">\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"4\">\u003cspan class=\"n\">05\u003c/span>Matriz de análisis\u003cspan class=\"done\">\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"5\">\u003cspan class=\"n\">06\u003c/span>Informe y evidencias\u003cspan class=\"done\">\u003c/span>\u003c/button>\n  \u003c/nav>\n\u003c/header>\n\n\u003cmain>\n\u003c!-- ================= 01 FUNDAMENTO ================= -->\n\u003csection class=\"panel active\" data-panel=\"0\">\n  \u003cdiv class=\"eyebrow\">Carpeta pedagógica · Semana 6\u003c/div>\n  \u003ch1 class=\"title\">Laboratorio de Ingeniería de Prompts para una Necesidad Educativa\u003c/h1>\n  \u003cp class=\"lede\">Un prompt es una instrucción, pero también una hipótesis: supone que la herramienta entenderá el propósito, el destinatario y los límites de lo que se le pide. Este laboratorio pide elegir una necesidad educativa concreta, escribir un primer prompt, evaluar con criterios lo que la herramienta devuelve, refinar, comparar, verificar y, al final, decidir qué partes del resultado exigen juicio humano. El producto es una \u003cstrong>Matriz de análisis\u003c/strong> que contrasta la versión inicial con la versión optimizada en siete elementos.\u003c/p>\n\n  \u003cdiv class=\"card accent\" style=\"margin-bottom:26px;\">\n    \u003cdiv class=\"label\">Pregunta orientadora\u003c/div>\n    \u003cp class=\"hero-q\">\"¿Qué le pedí exactamente a la herramienta, para quién, qué devolvió, qué de eso es verificable y qué sigue siendo una decisión mía?\"\u003c/p>\n  \u003c/div>\n\n  \u003ch2>Cinco lentes para diseñar y juzgar prompts\u003c/h2>\n  \u003cdiv class=\"stack\">\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">1\u003c/div>\u003cdiv>\n      \u003ch3>El prompt como diseño de instrucción, no como pregunta\u003c/h3>\n      \u003cdiv class=\"cite\">White et al. (2023) · Liu et al. (2023)\u003c/div>\n      \u003cp>Los modelos generativos producen texto condicionado por el contexto que reciben. White y colaboradores catalogan patrones reutilizables —asignar un rol, fijar el formato de salida, pedir pasos, exigir que el modelo pregunte antes de responder, declarar restricciones— y muestran que la calidad del resultado depende de cuánto de ese contexto se hace explícito. Un prompt educativo es un pequeño documento de diseño: propósito, destinatario, tarea, formato, criterios y límites.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Fases 1, 2 y 3 · Propósito, usuario y prompt inicial\u003c/b>Antes de escribir, responde quién usará el resultado y para qué decisión. El laboratorio analiza la estructura del prompt y señala los componentes ausentes.\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">2\u003c/div>\u003cdiv>\n      \u003ch3>Lo que la herramienta devuelve es plausible, no necesariamente cierto\u003c/h3>\n      \u003cdiv class=\"cite\">Ji et al. (2023) · Bender, Gebru, McMillan-Major y Shmitchell (2021)\u003c/div>\n      \u003cp>Los modelos de lenguaje optimizan la continuación probable de un texto, no su verdad. Ji y colaboradores documentan la \"alucinación\": contenido fluido y seguro que no se sostiene en ninguna fuente, especialmente en cifras, nombres, citas y normativa. Bender y colaboradores advierten que el texto generado reproduce los patrones —y los sesgos— de sus datos de entrenamiento. Por eso evaluar un resultado educativo exige criterios explícitos y verificación externa, no una impresión de calidad.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Fases 4, 5 y 8 · Evaluar, identificar limitaciones, verificar\u003c/b>Califica con la rúbrica, distingue si el problema nació del prompt, del modelo o de la tarea, y registra qué verificaste y contra qué fuente.\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">3\u003c/div>\u003cdiv>\n      \u003ch3>Refinar es iterar con evidencia\u003c/h3>\n      \u003cdiv class=\"cite\">Mollick y Mollick (2023) · White et al. (2023)\u003c/div>\n      \u003cp>Mollick y Mollick muestran que los prompts educativos útiles rara vez salen bien a la primera: se mejoran añadiendo contexto del grupo, ejemplos del nivel esperado, restricciones (extensión, vocabulario, lo que no debe incluir) y pidiendo que el modelo exponga su razonamiento o señale su incertidumbre. La comparación entre versiones es la evidencia de aprendizaje: qué cambió en el prompt y qué cambió, en consecuencia, en el resultado.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Fases 6 y 7 · Refinar y comparar\u003c/b>Usa las técnicas de refinamiento como repertorio, no como lista de control. Compara con la misma rúbrica y explica la diferencia.\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">4\u003c/div>\u003cdiv>\n      \u003ch3>IA generativa en educación: oportunidades con condiciones\u003c/h3>\n      \u003cdiv class=\"cite\">Kasneci et al. (2023) · UNESCO (2023)\u003c/div>\n      \u003cp>Kasneci y colaboradores sitúan el potencial de los modelos de lenguaje en la creación de materiales, la retroalimentación y la personalización, pero lo condicionan a la competencia de quien los usa para evaluar, a la protección de datos y a que el estudiante siga pensando. La guía de UNESCO pide validación humana de los contenidos, transparencia sobre el uso y exclusión de datos personales de estudiantes en los prompts.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Toda la secuencia\u003c/b>No incluyas datos identificables de estudiantes. Lo que pegues en el laboratorio es evidencia de tu proceso, no material para el aula hasta que lo revises.\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">5\u003c/div>\u003cdiv>\n      \u003ch3>El juicio humano no es la última fase: es el marco\u003c/h3>\n      \u003cdiv class=\"cite\">Molenaar (2022) · Holmes, Bialik y Fadel (2019)\u003c/div>\n      \u003cp>Molenaar describe la relación entre docente e IA como control compartido, graduado según la tarea y sus consecuencias. Decidir si un material es adecuado para este grupo, si una retroalimentación es justa, si una explicación simplifica demasiado o si un ejemplo es culturalmente pertinente son juicios que el modelo no puede hacer porque no conoce el aula. Nombrar esas partes es el producto más importante del laboratorio.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Fase 9 · Juicio y revisión humana\u003c/b>Marca qué partes del resultado revisarías siempre y decide cómo usarías el resultado: tal cual, con ajustes, como borrador o no usarlo.\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\n  \u003ch2 style=\"margin-top:28px;\">Componentes de un prompt educativo\u003c/h2>\n  \u003cdiv class=\"card\" style=\"margin-bottom:22px;\" id=\"patterns\">\u003c/div>\n\n  \u003ch2>Referencias de la carpeta\u003c/h2>\n  \u003cdiv class=\"card refs\">\u003cul id=\"refsList\">\u003c/ul>\u003c/div>\n  \u003cdiv class=\"nav-row\">\u003cspan>\u003c/span>\u003cbutton class=\"pill-btn primary goto\" data-goto=\"1\">Instrucciones →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 02 INSTRUCCIONES ================= -->\n\u003csection class=\"panel\" data-panel=\"1\">\n  \u003cdiv class=\"eyebrow\">Instrucciones de uso\u003c/div>\n  \u003ch1 class=\"title\">Cómo se recorre el laboratorio\u003c/h1>\n  \u003cp class=\"lede\">Trabajarás con una herramienta de IA generativa de tu elección (ChatGPT, Claude, Gemini, Copilot u otra) en una ventana aparte. El laboratorio no genera texto: estructura tu proceso, analiza la composición de tus prompts, te da una rúbrica para evaluar los resultados y arma automáticamente la Matriz de análisis con lo que registres.\u003c/p>\n  \u003cdiv class=\"grid g2\" style=\"margin-bottom:18px;\">\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"label\">Las nueve fases\u003c/div>\n      \u003cdiv class=\"flow-strip\">\u003cspan class=\"fs\">1 Propósito\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">2 Usuario\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">3 Prompt inicial\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">4 Calidad\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">5 Limitaciones\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">6 Refinar\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">7 Comparar\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">8 Verificar\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">9 Juicio humano\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card accent\">\n      \u003cdiv class=\"label\">Lo que el laboratorio no hace\u003c/div>\n      \u003cp style=\"margin:0; font-size:13.5px; color:var(--ink);\">No evalúa si tu resultado es \"bueno\": eso lo haces tú con la rúbrica y lo justificas. El analizador de prompts solo revisa la \u003cstrong>estructura\u003c/strong> (qué componentes están presentes); un prompt completo puede dar un mal resultado y uno breve, uno excelente. La evidencia es tu razonamiento al comparar.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-bottom:18px;\">\n    \u003cdiv class=\"label\">Pasos\u003c/div>\n    \u003col class=\"steps\">\n      \u003cli>\u003cb>Lee el fundamento\u003c/b> (01) y los componentes de un prompt educativo.\u003c/li>\n      \u003cli>\u003cb>Elige o define la necesidad educativa\u003c/b> (03): una del banco o una propia, concreta y acotada.\u003c/li>\n      \u003cli>\u003cb>Recorre las nueve fases\u003c/b> (04). En las fases 3 y 6 pegarás el prompt exacto que usaste y el resultado completo que obtuviste; en las fases 4 y 7 aplicarás la misma rúbrica a cada versión.\u003c/li>\n      \u003cli>\u003cb>Revisa la Matriz de análisis\u003c/b> (05): se construye sola con tus registros y muestra la diferencia entre versiones.\u003c/li>\n      \u003cli>\u003cb>Descarga el informe\u003c/b> (06) con la matriz, los prompts, los resultados, la verificación y las referencias.\u003c/li>\n    \u003c/ol>\n  \u003c/div>\n  \u003cdiv class=\"grid g3\">\n    \u003cdiv class=\"card tight\">\u003cdiv class=\"label\">Guardado\u003c/div>\u003cp style=\"margin:0; font-size:13px; color:var(--ink);\">El avance se guarda en este navegador. \"Reiniciar\" borra todo tras confirmar.\u003c/p>\u003c/div>\n    \u003cdiv class=\"card tight\">\u003cdiv class=\"label\">Duración estimada\u003c/div>\u003cp style=\"margin:0; font-size:13px; color:var(--ink);\">90 a 120 minutos con la herramienta abierta; puede hacerse en varias sesiones.\u003c/p>\u003c/div>\n    \u003cdiv class=\"card tight warn\">\u003cdiv class=\"label\">Datos personales\u003c/div>\u003cp style=\"margin:0; font-size:13px; color:var(--ink);\">No incluyas nombres, calificaciones ni descripciones identificables de estudiantes reales en ningún prompt.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"nav-row\">\u003cbutton class=\"pill-btn goto\" data-goto=\"0\">← Fundamento\u003c/button>\u003cbutton class=\"pill-btn primary goto\" data-goto=\"2\">Elegir la necesidad →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 03 NECESIDAD ================= -->\n\u003csection class=\"panel\" data-panel=\"2\">\n  \u003cdiv class=\"eyebrow\">Necesidad educativa\u003c/div>\n  \u003ch1 class=\"title\">Una necesidad concreta, acotada y tuya\u003c/h1>\n  \u003cp class=\"lede\">Elige una necesidad del banco o define la tuya. Cuanto más concreta —nivel, asignatura, grupo, situación—, más podrás juzgar si el resultado sirve. \"Mejorar la motivación\" no es una necesidad trabajable; \"diseñar tres preguntas de apertura para una clase de fracciones en cuarto grado con estudiantes que confunden numerador y denominador\" sí.\u003c/p>\n  \u003cdiv class=\"grid g2\" style=\"margin-bottom:18px;\" id=\"needBank\">\u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-bottom:14px;\">\n    \u003cdiv class=\"label\">Tu necesidad (puedes editar la que elegiste del banco)\u003c/div>\n    \u003cdiv class=\"grid g2\" style=\"gap:12px;\">\n      \u003cdiv class=\"field\">\u003cspan class=\"fl\">Título breve\u003c/span>\u003cinput type=\"text\" data-path=\"need.title\" placeholder=\"Ej.: Preguntas de apertura sobre fracciones\">\u003c/div>\n      \u003cdiv class=\"field\">\u003cspan class=\"fl\">Nivel, asignatura y contexto\u003c/span>\u003cinput type=\"text\" data-path=\"need.ctx\" placeholder=\"Ej.: 4.º grado, matemáticas, grupo de 28, escuela pública urbana\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field\" style=\"margin-top:12px;\">\u003cspan class=\"fl\">Descripción de la situación que requiere apoyo\u003c/span>\u003ctextarea data-path=\"need.desc\" placeholder=\"Qué pasa, con quién, qué se ha intentado, qué resultado se espera del apoyo de la IA.\">\u003c/textarea>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"nav-row\">\u003cbutton class=\"pill-btn goto\" data-goto=\"1\">← Instrucciones\u003c/button>\u003cbutton class=\"pill-btn primary goto\" data-goto=\"3\">Ir al laboratorio →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 04 LABORATORIO ================= -->\n\u003csection class=\"panel\" data-panel=\"3\">\n  \u003cdiv class=\"eyebrow\">Laboratorio\u003c/div>\n  \u003ch1 class=\"title\">Nueve fases, dos versiones\u003c/h1>\n  \u003cdiv class=\"stepper\" id=\"stepper\">\u003c/div>\n  \u003cdiv id=\"labBody\">\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 05 MATRIZ ================= -->\n\u003csection class=\"panel\" data-panel=\"4\">\n  \u003cdiv class=\"eyebrow\">Matriz de análisis\u003c/div>\n  \u003ch1 class=\"title\">Versión inicial frente a versión optimizada\u003c/h1>\n  \u003cp class=\"lede\">La matriz se construye con lo que registraste en las nueve fases. Las celdas vacías señalan fases pendientes. La columna optimizada no es \"mejor\" por definición: la rúbrica y tu comparación dicen si lo fue.\u003c/p>\n  \u003cdiv class=\"grid g3\" style=\"margin-bottom:22px;\" id=\"kpis\">\u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-bottom:22px;\">\u003cdiv class=\"mtx-wrap\">\u003ctable class=\"matrix\" id=\"matrix\">\u003c/table>\u003c/div>\u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-bottom:22px;\">\u003cdiv class=\"label\">Estructura de los prompts\u003c/div>\u003cdiv class=\"side\" id=\"promptCompare\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"card\">\u003cdiv class=\"label\">Rúbrica · versión inicial frente a optimizada\u003c/div>\u003cdiv id=\"rubricCompare\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"nav-row\">\u003cbutton class=\"pill-btn goto\" data-goto=\"3\">← Laboratorio\u003c/button>\u003cbutton class=\"pill-btn primary goto\" data-goto=\"5\">Preparar el informe →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 06 INFORME ================= -->\n\u003csection class=\"panel\" data-panel=\"5\">\n  \u003cdiv class=\"eyebrow\">Informe y evidencias\u003c/div>\n  \u003ch1 class=\"title\">Descarga el Informe del Laboratorio de Prompts\u003c/h1>\n  \u003cp class=\"lede\">El archivo reúne la necesidad educativa, la Matriz de análisis, ambos prompts con sus resultados completos, la rúbrica de cada versión, el registro de verificación, las partes que requieren juicio humano, tu reflexión y las referencias de la carpeta.\u003c/p>\n  \u003cdiv class=\"grid g2\" style=\"margin-bottom:18px;\">\n    \u003cdiv class=\"card\">\u003cdiv class=\"grid\" style=\"gap:12px;\">\n      \u003cdiv class=\"field\">\u003cspan class=\"fl\">Nombre del maestrante\u003c/span>\u003cinput type=\"text\" data-ref=\"nombre\" placeholder=\"Nombre y apellido\">\u003c/div>\n      \u003cdiv class=\"field\">\u003cspan class=\"fl\">Programa / cohorte (opcional)\u003c/span>\u003cinput type=\"text\" data-ref=\"programa\" placeholder=\"Ej.: Maestría en ... — cohorte ...\">\u003c/div>\n      \u003cdiv class=\"field\">\u003cspan class=\"fl\">Reflexión final · qué aprendiste sobre pedir, evaluar y decidir con IA generativa\u003c/span>\u003ctextarea data-ref=\"reflexion\" placeholder=\"Cuatro a ocho líneas.\">\u003c/textarea>\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003cdiv class=\"label\">Estado del informe\u003c/div>\u003cdiv id=\"checklist\" style=\"font-size:13.5px; line-height:1.9;\">\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"row\">\n    \u003cbutton class=\"pill-btn primary\" id=\"btnDownload\" style=\"padding:13px 22px; font-size:14px;\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3v12\"/>\u003cpolyline points=\"6 11 12 17 18 11\"/>\u003cpath d=\"M4 21h16\"/>\u003c/svg>Descargar informe (.html)\u003c/button>\n    \u003cspan class=\"note\">Cada descarga refleja el estado actual de tu trabajo.\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"nav-row\">\u003cbutton class=\"pill-btn goto\" data-goto=\"4\">← Matriz\u003c/button>\u003cspan>\u003c/span>\u003c/div>\n\u003c/section>\n\u003c/main>\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\n\u003cscript>\n(function(){\n'use strict';\nvar STORE_KEY='biu_lab_prompts_sem6_v1';\n\n/* ================= DATA ================= */\nvar PATTERNS=[\n {k:'Rol',d:'Quién debe \"ser\" la herramienta y con qué experiencia.',ex:'Actúa como docente de ciencias de secundaria con experiencia en evaluación formativa.'},\n {k:'Contexto',d:'Nivel, asignatura, características del grupo, lo que ya se hizo.',ex:'Grupo de 2.º de secundaria, 30 estudiantes, la mitad con dificultades de lectura; ya vimos el ciclo del agua.'},\n {k:'Tarea',d:'Un verbo preciso y un producto definido.',ex:'Diseña cuatro preguntas de comprensión de dificultad creciente...'},\n {k:'Destinatario',d:'Quién usará el resultado y qué hará con él.',ex:'...para que el docente las use como apertura de clase.'},\n {k:'Formato',d:'Estructura, extensión, lenguaje, idioma.',ex:'En una tabla con columnas pregunta / nivel / respuesta esperada; máximo 120 palabras por fila; español neutro.'},\n {k:'Restricciones',d:'Qué no debe hacer; criterios que debe cumplir.',ex:'No uses términos técnicos sin definirlos; evita ejemplos que requieran conocimientos no vistos.'},\n {k:'Ejemplos',d:'Una muestra del nivel o estilo esperado.',ex:'Ejemplo del nivel esperado: \"¿Qué pasaría con la lluvia si no existiera la evaporación?\"'},\n {k:'Verificación',d:'Pedir fuentes, incertidumbre o pasos.',ex:'Si no estás seguro de un dato, indícalo; no inventes referencias; explica brevemente por qué cada pregunta es más difícil que la anterior.'}\n];\nvar COMP=[\n {id:'rol',k:'Rol',re:/(act[uú]a como|eres (un|una|el|la)|asume el rol|como (docente|profesor|tutor|experto|especialista|dise[ñn]ador)|en tu rol de)/i},\n {id:'contexto',k:'Contexto',re:/(grado|curso|nivel|primaria|secundaria|universit|a[ñn]o de|estudiantes (de|con|que)|grupo de|asignatura|materia|cohorte|clase de|mis estudiantes|contexto)/i},\n {id:'tarea',k:'Tarea',re:/\\b(dise[ñn]a|redacta|escribe|elabora|genera|crea|propón|propon|explica|resume|evalúa|evalua|analiza|compara|clasifica|sugiere|planifica|adapta|traduce|formula|construye|lista|enumera|describe)\\b/i},\n {id:'destinatario',k:'Destinatario',re:/(para (que )?(el|la|los|las|un|una)? ?(docente|estudiante|alumn|familia|padres|coordinaci|tutor|equipo)|dirigid[oa] a|destinatari|quien lo usar|lo usar[áa])/i},\n {id:'formato',k:'Formato',re:/(formato|tabla|lista|viñetas|vinetas|columnas|m[áa]ximo|m[íi]nimo|palabras|p[áa]rrafos|oraciones|secciones|encabezados|numerad|json|markdown|en espa[ñn]ol|en ingl[ée]s|tono|lenguaje (sencillo|formal|claro))/i},\n {id:'restricciones',k:'Restricciones',re:/(\\bno (uses|incluyas|menciones|inventes|agregues|utilices|des|hagas)\\b|evita|sin (usar|incluir)|debe[sn]? |deber[áa]|solo |únicamente|unicamente|criterio|requisito|restricci|l[íi]mite)/i},\n {id:'ejemplos',k:'Ejemplos',re:/(por ejemplo|ejemplo:|ejemplos?\\b|como este|similar a|al estilo de|muestra:)/i},\n {id:'verificacion',k:'Verificación',re:/(fuente|cita|referencia|no est[áa]s segur|incertidumbre|indica si|se[ñn]ala si|justifica|explica por qu[ée]|paso a paso|razonamiento|antes de responder|pregúntame|preguntame|haz preguntas)/i}\n];\nvar NEEDS=[\n {t:'Preguntas de apertura con diagnóstico de errores',who:'Para el docente',ctx:'4.º grado · matemáticas · 28 estudiantes',d:'Diseñar preguntas de apertura sobre fracciones que hagan visibles las confusiones entre numerador y denominador, con respuestas esperadas.'},\n {t:'Retroalimentación formativa a un texto estudiantil',who:'Para el estudiante',ctx:'1.º de bachillerato · lengua · ensayo argumentativo',d:'Obtener comentarios sobre estructura argumentativa de un ensayo anonimizado, en tono constructivo y con dos sugerencias concretas de mejora.'},\n {t:'Adaptación de una lectura a dos niveles',who:'Para estudiantes con distinta competencia lectora',ctx:'6.º grado · ciencias · texto sobre ecosistemas',d:'Reescribir un texto informativo en dos versiones (lector en desarrollo y lector avanzado) manteniendo los conceptos clave.'},\n {t:'Rúbrica para un proyecto interdisciplinario',who:'Para el equipo docente',ctx:'Secundaria · proyecto de ciencias sociales y arte',d:'Elaborar una rúbrica de cuatro niveles con criterios observables para un proyecto que combina investigación histórica y producción visual.'},\n {t:'Explicación alternativa de un concepto difícil',who:'Para estudiantes que no comprendieron la primera explicación',ctx:'Universidad · estadística introductoria · valor p',d:'Generar dos explicaciones alternativas del valor p con analogías del contexto de los estudiantes y señalar los malentendidos frecuentes.'},\n {t:'Mensaje a familias sobre un cambio de evaluación',who:'Para las familias',ctx:'Primaria · coordinación académica',d:'Redactar una comunicación clara sobre el paso a evaluación por competencias, anticipando preguntas frecuentes, en lenguaje accesible.'},\n {t:'Secuencia didáctica breve con evaluación formativa',who:'Para el docente',ctx:'3.º de secundaria · historia · 2 sesiones',d:'Planificar dos sesiones sobre causas de una revolución, con actividad de apertura, desarrollo, cierre y una pregunta de salida por sesión.'},\n {t:'Casos para discusión ética en formación profesional',who:'Para estudiantes de posgrado',ctx:'Maestría · ética profesional · seminario',d:'Crear tres casos breves y verosímiles sobre dilemas de uso de IA en la docencia, con preguntas guía que no induzcan una respuesta.'}\n];\nvar SUPPORT={materiales:'Diseñar materiales o actividades',retro:'Dar retroalimentación',explicar:'Explicar o reexplicar un concepto',evaluar:'Evaluar o construir instrumentos',planificar:'Planificar clases o secuencias',diferenciar:'Diferenciar o adaptar para la diversidad',comunicar:'Comunicar con familias o colegas'};\nvar USERS={docente:'El docente',estudiante:'El estudiante',familia:'Las familias',equipo:'El equipo docente o coordinación',yo:'El propio maestrante'};\nvar TOOLS=['ChatGPT','Claude','Gemini','Copilot','Otra'];\nvar RUB=[\n {id:'pert',k:'Pertinencia al propósito',d:'Responde a lo que la necesidad pedía, no a algo parecido.'},\n {id:'exac',k:'Exactitud',d:'Sin errores conceptuales, cifras inventadas ni referencias dudosas.'},\n {id:'adec',k:'Adecuación al usuario y al nivel',d:'Lenguaje, complejidad y ejemplos acordes al destinatario.'},\n {id:'comp',k:'Completitud',d:'Cubre todo lo pedido sin omisiones ni relleno.'},\n {id:'clar',k:'Claridad y organización',d:'Se entiende y se puede usar sin reordenarlo.'},\n {id:'sesg',k:'Ausencia de sesgos o contenido inapropiado',d:'Sin estereotipos, generalizaciones ni ejemplos excluyentes.'}\n];\nvar SCALE={1:'1',2:'2',3:'3',4:'4'};\nvar ISSUES=[\n {id:'inv',t:'Inventó datos, cifras, nombres o referencias'},\n {id:'gen',t:'Resultado genérico: serviría para cualquier grupo'},\n {id:'niv',t:'Nivel o lenguaje inadecuado para el destinatario'},\n {id:'ign',t:'Ignoró una restricción o parte de la tarea'},\n {id:'ses',t:'Sesgo, estereotipo o ejemplo excluyente'},\n {id:'ton',t:'Tono inadecuado para el uso previsto'},\n {id:'ext',t:'Extensión o formato distintos de lo pedido'},\n {id:'amb',t:'Ambigüedad: interpretó el prompt de otra forma'},\n {id:'ped',t:'Error pedagógico: la actividad no logra lo que pretende'}\n];\nvar ORIGIN={prompt:'Del prompt',modelo:'Del modelo',tarea:'De la tarea'};\nvar TECH={rol:'Añadir o precisar el rol',ctx:'Añadir contexto del grupo',fmt:'Especificar formato y extensión',ej:'Dar un ejemplo del nivel esperado',res:'Decla l ejemplo de la pizza es pertinente para este grupo.')+'\u003c/div>\u003c/div>';\n if(i===5) h+='\u003cdiv class=\"card\" style=\"margin-bottom:14px;\">\u003cdiv class=\"label\">Prompt inicial (referencia)\u003c/div>\u003cpre style=\"white-space:pre-wrap; font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); margin:0; max-height:180px; overflow:auto;\">'+esc(S.p3.prompt||'(sin prompt inicial)')+'\u003c/pre>\u003c/div>\u003cdiv class=\"card\" style=\"margin-bottom:14px;\">\u003cdiv class=\"label\">Técnicas de refinamiento aplicadas\u003c/div>'+chips('p6.tech',TECH,S.p6.tech)+'\u003c/div>\u003cdiv class=\"card\" style=\"margin-bottom:14px;\">'+ta('p6.purpose','¿Ajustaste el propósito? Si no, déjalo vacío y se usará el inicial','Ej.: ahora el propósito incluye detectar también la confusión entre fracción y división.')+'\u003c/div>\u003cdiv class=\"card\" style=\"margin-bottom:14px;\">'+ta('p6.prompt','Prompt optimizado, exactamente como lo enviaste','Pega el texto completo del prompt refinado.','prompt')+'\u003cdiv style=\"margin-top:12px;\">\u003cdiv class=\"label\">Análisis de estructura\u003c/div>'+analyzerHTML(S.p6.prompt)+'\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"margin-bottom:14px;\">'+ta('p6.expected','Resultado esperado de la versión optimizada','Qué cambio concreto esperabas en el resultado.')+'\u003cdiv style=\"margin-top:12px;\">'+ta('p6.result','Resultado obtenido (pega la respuesta completa)','Pega la respuesta sin editarla.','result')+'\u003c/div>\u003c/div>';\n if(i===6) h+='\u003cdiv class=\"card\" style=\"margin-bottom:14px;\">\u003cdiv class=\"label\">Los dos resultados\u003c/div>\u003cdiv class=\"side\">\u003cdiv class=\"col\">\u003cdiv class=\"label\">Versión inicial\u003c/div>\u003cpre>'+esc(S.p3.result||'(pendiente)')+'\u003c/pre>\u003c/div>\u003cdiv class=\"col v2\">\u003cdiv class=\"label\">Versión optimizada\u003c/div>\u003cpre>'+esc(S.p6.result||'(pendiente)')+'\u003c/pre>\u003c/div>\u003c/div>\u003c/div>\u003cdiv c \">Verifica siempre cifras, nombres, citas, normativa y afirmaciones sobre \"lo que la investigación muestra\".\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"card\" style=\"margin-bottom:14px;\">'+ta('p8.note','Qué no pudiste verificar y qué harías con esa parte del resultado','Ej.: la afirmación sobre el porcentaje de estudiantes con la confusión no aparece en ninguna fuente: la elimino del material.')+'\u003c/div>';\n if(i===8) h+='\u003cdiv class=\"card\" style=\"margin-bottom:14px;\">\u003cdiv class=\"label\">Partes del resultado que requieren juicio o revisión humana\u003c/div>'+chips('p9.parts',HUMAN,S.p9.parts)+'\u003c/div>\u003cdiv class=\"card\" style=\"margin-bottom:14px;\">'+ta('p9.decides','Qué decide la persona y qué no delega en la herramienta, en este caso','Ej.: yo decido si las preguntas se ajustan a lo que mi grupo confunde de verdad; la herramienta propone redacciones.')+'\u003cdiv style=\"margin-top:12px;\">\u003cdiv class=\"label\">¿Cómo usarías el resultado optimizado?\u003c/div>'+seg('p9.use',USE,S.p9.use)+'\u003c/div>\u003c/div>';\n h+=nav(i); $('#labBody').innerHTML=h; }\n\n/* ================= RENDER: MATRIZ ================= */\nfunction matrixRows(){ var s=S,a1=analyze(s.p3.prompt),a2=analyze(s.p6.prompt),r1=rubAvg(s.p4.rub),r2=rubAvg(s.p7.rub); function lst(obj,dict){ return Object.keys(obj).filter(function(k){return obj[k];}).map(function(k){ var d=dict.filter(function(x){return x.id===k;})[0]; return d?d.t+(s.p5.origin[k]?' ('+ORIGIN[s.p5.origin[k]].toLowerCase()+')':''):k; }).join('; '); }\n var ver2=s.p8.items.filter(function(it){return it.claim.trim();}).map(function(it){ return it.claim+(it.status?' — '+VSTATUS[it.status].toLowerCase():''); }).join('; ');\n return [\n  {e:'Propósito educativo',v1:s.p1.purpose,v2:s.p6.purpose.trim()||s.p1.purpose},\n  {e:'Prompt',v1:s.p3.prompt,v2:s.p6.prompt,m1:a1.n+'/8 componentes · '+a1.words+' palabras',m2:a2.n+'/8 componentes · '+a2.words+' palabras'},\n  {e:'Resultado esperado',v1:s.p3.ex FS8MXIeskrn02kYHv+VXw/yh1ZO7f8hc0AAAAAElFTkSuQmCC\" alt=\"BIU Broward International University\">\n      \u003cdiv class=\"divider\">\u003c/div>\n      \u003cspan class=\"tag\">Laboratorio de Evaluación Comparativa de Herramientas de IA Educativa\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"top-actions\">\n      \u003cbutton class=\"pill-btn\" id=\"btnReset\" title=\"Borrar todo el trabajo y empezar de nuevo\">Reiniciar\u003c/button>\n      \u003cbutton class=\"pill-btn primary\" id=\"btnDownloadTop\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3v12\"/>\u003cpolyline points=\"6 11 12 17 18 11\"/>\u003cpath d=\"M4 21h16\"/>\u003c/svg>Informe\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cnav class=\"tabs\" id=\"tabs\">\n    \u003cbutton class=\"tab active\" data-tab=\"0\">\u003cspan class=\"n\">01\u003c/span>Fundamento teórico\u003cspan class=\"done\">\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"1\">\u003cspan class=\"n\">02\u003c/span>Instrucciones\u003cspan class=\"done\">\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"2\">\u003cspan class=\"n\">03\u003c/span>Necesidad y herramientas\u003cspan class=\"done\">\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"3\">\u003cspan class=\"n\">04\u003c/span>Laboratorio comparativo\u003cspan class=\"done\">\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"4\">\u003cspan class=\"n\">05\u003c/span>Matriz y resultados\u003cspan class=\"done\">\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"5\">\u003cspan class=\"n\">06\u003c/span>Recomendación e informe\u003cspan class=\"done\">\u003c/span>\u003c/button>\n  \u003c/nav>\n\u003c/header>\n\n\u003cmain>\n\u003c!-- ================= 01 FUNDAMENTO ================= -->\n\u003csection class=\"panel active\" data-panel=\"0\">\n  \u003cdiv class=\"eyebrow\">Carpeta pedagógica · Laboratorio comparativo\u003c/div>\n  \u003ch1 class=\"title\">Laboratorio de Evaluación Comparativa de Herramientas de IA Educativa\u003c/h1>\n  \u003cp class=\"lede\">Dos herramientas pueden prometer lo mismo y servir para cosas distintas. Este laboratorio pide elegir una necesidad educativa concreta, seleccionar dos herramientas de IA que digan responderla y compararlas con \u003cstrong>catorce criterios comunes\u003c/strong>, ponderados según lo que esa necesidad exige. El producto es una matriz comparativa con evidencia por celda y una \u003cstrong>recomendación preliminar\u003c/strong> que dice qué herramienta, para quién, bajo qué condiciones y qué queda por comprobar.\u003c/p>\n\n  \u003cdiv class=\"card accent\" style=\"margin-bottom:26px;\">\n    \u003cdiv class=\"label\">Pregunta orientadora\u003c/div>\n    \u003cp class=\"hero-q\">\"¿Cuál de las dos responde mejor a esta necesidad, para este usuario, con evidencia que yo mismo comprobé, y qué condiciones harían aceptable usarla?\"\u003c/p>\n  \u003c/div>\n\n  \u003ch2>Cinco lentes para comparar con criterio\u003c/h2>\n  \u003cdiv class=\"stack\">\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">1\u003c/div>\u003cdiv>\n      \u003ch3>La necesidad define los criterios, no la herramienta\u003c/h3>\n      \u003cdiv class=\"cite\">Cuban (2001) · Selwyn (2019) · Kirkwood y Price (2014)\u003c/div>\n      \u003cp>Cuban mostró que las tecnologías llegan \"sobrevendidas y subutilizadas\" cuando se adoptan por sus funciones y no por un problema identificado. Kirkwood y Price revisaron décadas de evaluaciones de tecnología educativa y encontraron que casi nunca se define qué significa \"mejorar\": sin esa definición cualquier herramienta parece buena. Por eso el laboratorio empieza por la necesidad y pide ponderar cada criterio según lo que esa necesidad exige.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Fase 03 y ponderación\u003c/b>Formula la necesidad y el usuario antes de abrir las herramientas. Asigna peso alto solo a los criterios que, para esta necesidad, son decisivos.\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">2\u003c/div>\u003cdiv>\n      \u003ch3>Marcos para evaluar IA en educación\u003c/h3>\n      \u003cdiv class=\"cite\">Holmes et al. (2022) · UNESCO (2023) · Luckin, Holmes, Griffiths y Forcier (2016)\u003c/div>\n      \u003cp>Holmes y colaboradores proponen un marco ético comunitario para la IA educativa que exige examinar datos, algoritmos y pedagogía a la vez; la guía de UNESCO sobre IA generativa añade condiciones concretas: protección de datos, edad mínima, validación humana de contenidos y transparencia sobre el uso. Luckin distingue entre herramientas centradas en el estudiante, en el docente y en el sistema: dos herramientas \"para la misma necesidad\" pueden ocupar lugares distintos en esa distinción.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Criterios 1–3, 10, 11 y 13\u003c/b>Necesidad, usuario y función de IA encuadran la comparación; privacidad, transparencia y supervisión humana son condiciones, no solo puntuaciones.\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">3\u003c/div>\u003cdiv>\n      \u003ch3>Usabilidad y accesibilidad se prueban, no se leen\u003c/h3>\n      \u003cdiv class=\"cite\">Nielsen (1994) · W3C (2018) · CAST (2018)\u003c/div>\n      \u003cp>Las heurísticas de usabilidad de Nielsen —visibilidad del estado, control del usuario, prevención de errores, consistencia— siguen siendo el filtro más rápido para detectar fricción. Las pautas WCAG 2.1 definen accesibilidad de forma verificable (contraste, navegación por teclado, compatibilidad con lectores de pantalla, subtítulos); el Diseño Universal para el Aprendizaje pide además múltiples formas de representación, acción y compromiso. Nada de esto se evalúa desde la página de marketing.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Criterios 4–7\u003c/b>Registra para cada celda cómo lo comprobaste: prueba directa, documentación, reseñas de terceros o no comprobado. Una puntuación sin comprobación queda marcada.\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">4\u003c/div>\u003cdiv>\n      \u003ch3>Calidad, retroalimentación y los riesgos del texto plausible\u003c/h3>\n      \u003cdiv class=\"cite\">Kasneci et al. (2023) · Ji et al. (2023) · Baker y Hawn (2022)\u003c/div>\n      \u003cp>Las herramientas generativas producen respuestas fluidas que pueden contener errores conceptuales, datos inventados o sesgos (Ji; Baker y Hawn). Kasneci y colaboradores sitúan su valor en la retroalimentación y la creación de materiales, siempre que quien las use pueda evaluar lo que producen. Comparar \"calidad de respuestas\" exige la misma tarea en ambas herramientas y criterios explícitos: pertinencia, exactitud, adecuación al nivel, ausencia de sesgo.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Criterios 8 y 9\u003c/b>Haz la misma consulta o tarea en las dos herramientas y califica el resultado con los mismos criterios. Guarda el ejemplo como evidencia.\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">5\u003c/div>\u003cdiv>\n      \u003ch3>Privacidad, transparencia y supervisión como condiciones\u003c/h3>\n      \u003cdiv class=\"cite\">Slade y Prinsloo (2013) · Regan y Jesse (2019) · Molenaar (2022)\u003c/div>\n      \u003cp>Regan y Jesse describen cómo las plataformas educativas convierten el aprendizaje en datos que clasifican y rastrean a los estudiantes; Slade y Prinsloo recuerdan que el consentimiento y la posibilidad de rectificar no son opcionales. Molenaar propone graduar el control humano según las consecuencias de la tarea. Una herramienta con puntuación alta en todo lo demás y baja en privacidad no es \"buena con un defecto\": no cumple una condición.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Criterios 10, 11 y 13 · Recomendación\u003c/b>El laboratorio marca umbrales mínimos en privacidad y accesibilidad. La recomendación debe nombrar las condiciones de uso, no solo la herramienta.\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\n  \u003ch2 style=\"margin-top:28px;\">Niveles de la escala (1–4) para los criterios puntuados\u003c/h2>\n  \u003cdiv class=\"card\" style=\"margin-bottom:22px;\">\u003cdiv class=\"mtx-wrap\">\u003ctable class=\"mx\" id=\"scaleTable\">\u003c/table>\u003c/div>\u003c/div>\n\n  \u003ch2>Referencias de la carpeta\u003c/h2>\n  \u003cdiv class=\"card refs\">\u003cul id=\"refsList\">\u003c/ul>\u003c/div>\n  \u003cdiv class=\"nav-row\">\u003cspan>\u003c/span>\u003cbutton class=\"pill-btn primary goto\" data-goto=\"1\">Instrucciones →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 02 INSTRUCCIONES ================= -->\n\u003csection class=\"panel\" data-panel=\"1\">\n  \u003cdiv class=\"eyebrow\">Instrucciones de uso\u003c/div>\n  \u003ch1 class=\"title\">Cómo se recorre el laboratorio\u003c/h1>\n  \u003cp class=\"lede\">Compararás dos herramientas de IA reales que puedan responder a una misma necesidad educativa. Necesitas acceso a ambas (versión gratuita o de prueba basta) para comprobar lo que puntúes. El laboratorio organiza los catorce criterios, registra evidencia y fuente de comprobación por celda, pondera según tu necesidad y arma la matriz y la recomendación.\u003c/p>\n  \u003cdiv class=\"grid g2\" style=\"margin-bottom:18px;\">\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"label\">Secuencia\u003c/div>\n      \u003cdiv class=\"flow-strip\">\u003cspan class=\"fs\">Necesidad y usuario\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">Herramientas A y B\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">Encuadre (1–3)\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">Experiencia de uso (4–7)\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">Calidad y confianza (8–11)\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">Límites y valor (12–14)\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">Matriz\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">Recomendación\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card accent\">\n      \u003cdiv class=\"label\">Lo que el laboratorio no hace\u003c/div>\n      \u003cp style=\"margin:0; font-size:13.5px; color:var(--ink);\">No conoce las herramientas ni decide por ti. Calcula totales ponderados con tus puntuaciones y tus pesos, marca umbrales mínimos y señala celdas sin comprobación. La recomendación es tuya y debe sostenerse en la evidencia que registraste.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-bottom:18px;\">\n    \u003cdiv class=\"label\">Pasos\u003c/div>\n    \u003col class=\"steps\">\n      \u003cli>\u003cb>Lee el fundamento\u003c/b> (01) y la escala de cuatro niveles.\u003c/li>\n      \u003cli>\u003cb>Define la necesidad y el usuario, y elige las dos herramientas\u003c/b> (03). Ambas deben decir responder a la misma necesidad; si son de categorías distintas, mejor: la comparación será más informativa.\u003c/li>\n      \u003cli>\u003cb>Recorre los catorce criterios\u003c/b> (04) en cuatro bloques. Para cada criterio puntuado: nivel 1–4 por herramienta, cómo lo comprobaste y una evidencia breve. Asigna el peso del criterio para tu necesidad.\u003c/li>\n      \u003cli>\u003cb>Revisa la matriz\u003c/b> (05): totales ponderados, gráfico por criterio, alertas de umbral y celdas sin comprobar.\u003c/li>\n      \u003cli>\u003cb>Formula la recomendación preliminar\u003c/b> (06) y descarga el informe.\u003c/li>\n    \u003c/ol>\n  \u003c/div>\n  \u003cdiv class=\"grid g3\">\n    \u003cdiv class=\"card tight\">\u003cdiv class=\"label\">Guardado\u003c/div>\u003cp style=\"margin:0; font-size:13px; color:var(--ink);\">El avance se guarda en este navegador. \"Reiniciar\" borra todo tras confirmar.\u003c/p>\u003c/div>\n    \u003cdiv class=\"card tight\">\u003cdiv class=\"label\">Duración estimada\u003c/div>\u003cp style=\"margin:0; font-size:13px; color:var(--ink);\">2 a 3 horas incluyendo las pruebas en ambas herramientas; puede hacerse en varias sesiones.\u003c/p>\u003c/div>\n    \u003cdiv class=\"card tight warn\">\u003cdiv class=\"label\">Datos personales\u003c/div>\u003cp style=\"margin:0; font-size:13px; color:var(--ink);\">Al probar las herramientas no introduzcas datos de estudiantes reales. Usa ejemplos ficticios o anonimizados.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"nav-row\">\u003cbutton class=\"pill-btn goto\" data-goto=\"0\">← Fundamento\u003c/button>\u003cbutton class=\"pill-btn primary goto\" data-goto=\"2\">Definir necesidad y herramientas →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 03 NECESIDAD Y HERRAMIENTAS ================= -->\n\u003csection class=\"panel\" data-panel=\"2\">\n  \u003cdiv class=\"eyebrow\">Necesidad y herramientas\u003c/div>\n  \u003ch1 class=\"title\">Una necesidad, dos candidatas\u003c/h1>\n  \u003cp class=\"lede\">Primero la necesidad, después las herramientas. Si eliges las herramientas antes, los criterios se acomodarán a ellas.\u003c/p>\n  \u003cdiv class=\"card\" style=\"margin-bottom:14px;\">\n    \u003cdiv class=\"label\">Necesidad educativa\u003c/div>\n    \u003cdiv class=\"grid g2\" style=\"gap:12px;\">\n      \u003cdiv class=\"field\">\u003cspan class=\"fl\">Título breve\u003c/span>\u003cinput type=\"text\" data-path=\"need.title\" placeholder=\"Ej.: Retroalimentación escrita inmediata a borradores de ensayo\">\u003c/div>\n      \u003cdiv class=\"field\">\u003cspan class=\"fl\">Nivel, asignatura y contexto\u003c/span>\u003cinput type=\"text\" data-path=\"need.ctx\" placeholder=\"Ej.: 1.º de bachillerato · lengua · grupos de 35\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field\" style=\"margin-top:12px;\">\u003cspan class=\"fl\">Descripción: qué pasa, para quién y qué debería cambiar\u003c/span>\u003ctextarea data-path=\"need.desc\" placeholder=\"Tres a seis líneas.\">\u003c/textarea>\u003c/div>\n    \u003cdiv style=\"margin-top:12px;\">\u003cdiv class=\"label\">Usuario principal del resultado\u003c/div>\u003cdiv id=\"needUser\">\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003ch2>Categorías de herramientas de IA educativa\u003c/h2>\n  \u003cp class=\"muted\" style=\"margin:0 0 12px; font-size:14px;\">Orientación para elegir. Los ejemplos del mercado cambian con rapidez; verifica qué existe y qué versión probarás.\u003c/p>\n  \u003cdiv class=\"grid g2 bank\" style=\"margin-bottom:18px;\" id=\"toolBank\">\u003c/div>\n  \u003cdiv class=\"ab\" style=\"margin-bottom:14px;\">\n    \u003cdiv class=\"tool a\">\u003cdiv class=\"tn\">\u003cb>Herramienta A\u003c/b>\u003c/div>\u003cdiv class=\"field\">\u003cspan class=\"fl\">Nombre y versión probada\u003c/span>\u003cinput type=\"text\" data-path=\"tools.A.name\" placeholder=\"Ej.: Nombre de la herramienta (plan gratuito, web)\">\u003c/div>\u003cdiv class=\"field\" style=\"margin-top:10px;\">\u003cspan class=\"fl\">Categoría\u003c/span>\u003cselect data-path=\"tools.A.cat\" id=\"catA\">\u003c/select>\u003c/div>\u003cdiv class=\"field\" style=\"margin-top:10px;\">\u003cspan class=\"fl\">Qué promete para esta necesidad (según la propia herramienta)\u003c/span>\u003ctextarea data-path=\"tools.A.promise\">\u003c/textarea>\u003c/div>\u003cdiv class=\"field\" style=\"margin-top:10px;\">\u003cspan class=\"fl\">Cómo la probaste (tiempo, tareas realizadas, con qué cuenta)\u003c/span>\u003ctextarea data-path=\"tools.A.how\">\u003c/textarea>\u003c/div>\u003c/div>\n    \u003cdiv class=\"tool b\">\u003cdiv class=\"tn\">\u003cb>Herramienta B\u003c/b>\u003c/div>\u003cdiv class=\"field\">\u003cspan class=\"fl\">Nombre y versión probada\u003c/span>\u003cinput type=\"text\" data-path=\"tools.B.name\" placeholder=\"Ej.: Nombre de la herramienta (prueba de 14 días)\">\u003c/div>\u003cdiv class=\"field\" style=\"margin-top:10px;\">\u003cspan class=\"fl\">Categoría\u003c/span>\u003cselect data-path=\"tools.B.cat\" id=\"catB\">\u003c/select>\u003c/div>\u003cdiv class=\"field\" style=\"margin-top:10px;\">\u003cspan class=\"fl\">Qué promete para esta necesidad (según la propia herramienta)\u003c/span>\u003ctextarea data-path=\"tools.B.promise\">\u003c/textarea>\u003c/div>\u003cdiv class=\"field\" style=\"margin-top:10px;\">\u003cspan class=\"fl\">Cómo la probaste (tiempo, tareas realizadas, con qué cuenta)\u003c/span>\u003ctextarea data-path=\"tools.B.how\">\u003c/textarea>\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card accent\">\u003cdiv class=\"label\">Tarea de prueba común\u003c/div>\u003cp class=\"note\" style=\"margin:0 0 8px;\">Para comparar calidad y retroalimentación, define una misma tarea que realizarás en ambas herramientas.\u003c/p>\u003cdiv class=\"field\">\u003ctextarea data-path=\"need.task\" placeholder=\"Ej.: Pegar el mismo borrador ficticio de ensayo (300 palabras) y pedir retroalimentación sobre tesis, argumentos y cohesión.\">\u003c/textarea>\u003c/div>\u003c/div>\n  \u003cdiv class=\"nav-row\">\u003cbutton class=\"pill-btn goto\" data-goto=\"1\">← Instrucciones\u003c/button>\u003cbutton class=\"pill-btn primary goto\" data-goto=\"3\">Ir al laboratorio →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 04 LABORATORIO ================= -->\n\u003csection class=\"panel\" data-panel=\"3\">\n  \u003cdiv class=\"eyebrow\">Laboratorio comparativo\u003c/div>\n  \u003ch1 class=\"title\">Catorce criterios, dos herramientas\u003c/h1>\n  \u003cdiv class=\"stepper\" id=\"stepper\">\u003c/div>\n  \u003cdiv id=\"labBody\">\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 05 MATRIZ ================= -->\n\u003csection class=\"panel\" data-panel=\"4\">\n  \u003cdiv class=\"eyebrow\">Matriz y resultados\u003c/div>\n  \u003ch1 class=\"title\">Lo que la evidencia permite comparar\u003c/h1>\n  \u003cp class=\"lede\">Los totales combinan tus puntuaciones con los pesos que asignaste. Las alertas señalan condiciones no cumplidas y celdas sin comprobación. Un total mayor no es una recomendación: es el punto de partida para formularla.\u003c/p>\n  \u003cdiv class=\"grid g3\" style=\"margin-bottom:22px;\" id=\"kpis\">\u003c/div>\n  \u003cdiv class=\"stack\" style=\"margin-bottom:22px;\" id=\"flags\">\u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-bottom:22px;\">\u003cdiv class=\"label\">Puntuación por criterio (ponderada)\u003c/div>\u003cdiv class=\"chart\" id=\"chart\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"card\">\u003cdiv class=\"mtx-wrap\">\u003ctable class=\"mx\" id=\"matrix\">\u003c/table>\u003c/div>\u003c/div>\n  \u003cdiv class=\"nav-row\">\u003cbutton class=\"pill-btn goto\" data-goto=\"3\">← Laboratorio\u003c/button>\u003cbutton class=\"pill-btn primary goto\" data-goto=\"5\">Formular la recomendación →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 06 RECOMENDACIÓN ================= -->\n\u003csection class=\"panel\" data-panel=\"5\">\n  \u003cdiv class=\"eyebrow\">Recomendación preliminar e informe\u003c/div>\n  \u003ch1 class=\"title\">Qué herramienta, para quién, bajo qué condiciones\u003c/h1>\n  \u003cp class=\"lede\">La recomendación es preliminar: se apoya en una prueba limitada, hecha por una persona, con una tarea. Debe decir qué recomiendas, por qué según los criterios ponderados, qué condiciones exige y qué falta por comprobar antes de una decisión institucional.\u003c/p>\n  \u003cdiv class=\"card\" style=\"margin-bottom:14px;\">\u003cdiv class=\"label\">Decisión preliminar\u003c/div>\u003cdiv id=\"recSeg\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-bottom:14px;\">\u003cdiv class=\"label\">Condiciones para un uso aceptable\u003c/div>\u003cdiv id=\"recCond\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-bottom:14px;\" id=\"recText\">\u003c/div>\n  \u003cdiv class=\"card accent\" style=\"margin-bottom:18px;\">\u003cdiv class=\"label\">Borrador de recomendación generado con tus registros\u003c/div>\u003cdiv class=\"rec\" id=\"recDraft\">\u003c/div>\u003cp class=\"note\" style=\"margin:10px 0 0;\">Úsalo como punto de partida; la recomendación final es tu texto.\u003c/p>\u003c/div>\n  \u003cdiv class=\"grid g2\" style=\"margin-bottom:18px;\">\n    \u003cdiv class=\"card\">\u003cdiv class=\"grid\" style=\"gap:12px;\">\n      \u003cdiv class=\"field\">\u003cspan class=\"fl\">Nombre del maestrante\u003c/span>\u003cinput type=\"text\" data-ref=\"nombre\" placeholder=\"Nombre y apellido\">\u003c/div>\n      \u003cdiv class=\"field\">\u003cspan class=\"fl\">Programa / cohorte (opcional)\u003c/span>\u003cinput type=\"text\" data-ref=\"programa\" placeholder=\"Ej.: Maestría en ... — cohorte ...\">\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003cdiv class=\"label\">Estado del informe\u003c/div>\u003cdiv id=\"checklist\" style=\"font-size:13.5px; line-height:1.9;\">\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"row\">\n    \u003cbutton class=\"pill-btn primary\" id=\"btnDownload\" style=\"padding:13px 22px; font-size:14px;\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3v12\"/>\u003cpolyline points=\"6 11 12 17 18 11\"/>\u003cpath d=\"M4 21h16\"/>\u003c/svg>Descargar informe (.html)\u003c/button>\n    \u003cspan class=\"note\">Cada descarga refleja el estado actual de tu trabajo.\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"nav-row\">\u003cbutton class=\"pill-btn goto\" data-goto=\"4\">← Matriz\u003c/button>\u003cspan>\u003c/span>\u003c/div>\n\u003c/section>\n\u003c/main>\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\n\u003cscript>\n(function(){\n'use strict';\nvar STORE_KEY='biu_lab_comparativa_ia_v1';\n\n/* ================= DATA ================= */\nvar USERS={docente:'Docente',estudiante:'Estudiante',familia:'Familias',gestion:'Coordinación o gestión',mixto:'Docente y estudiante'};\nvar CATS=['Tutor o asistente conversacional','Generador de contenidos y materiales','Retroalimentación o corrección automática','Plataforma adaptativa o de práctica','Asistente de planificación docente','Evaluación y cuestionarios con IA','Transcripción, traducción o accesibilidad','Analítica y alertas de aprendizaje','Generación de imágenes, audio o video','Otra'];\nvar BANK=[\n {t:'Tutor o asistente conversacional',d:'Responde dudas, explica y guía paso a paso; el estudiante dialoga con el sistema.',ex:'Riesgo típico: respuestas seguras y erróneas; dependencia.'},\n {t:'Generador de contenidos y materiales',d:'Produce textos, ejercicios, presentaciones o lecturas a partir de un prompt.',ex:'Riesgo típico: material genérico; errores conceptuales sin revisar.'},\n {t:'Retroalimentación o corrección automática',d:'Comenta o califica producciones del estudiante (textos, código, respuestas abiertas).',ex:'Riesgo típico: retroalimentación superficial; calificación sin supervisión.'},\n {t:'Plataforma adaptativa o de práctica',d:'Ajusta la dificultad y la secuencia según el desempeño del estudiante.',ex:'Riesgo típico: opacidad del algoritmo; rutas fijas que etiquetan.'},\n {t:'Asistente de planificación docente',d:'Ayuda a diseñar secuencias, rúbricas y actividades alineadas al currículo.',ex:'Riesgo típico: alineación aparente con el currículo; tiempo ahorrado que no se reinvierte.'},\n {t:'Evaluación y cuestionarios con IA',d:'Genera preguntas, analiza resultados o detecta patrones de error.',ex:'Riesgo típico: ítems de baja validez; uso punitivo de los datos.'},\n {t:'Transcripción, traducción o accesibilidad',d:'Subtítulos, lectura en voz alta, traducción, resúmenes para distintos perfiles.',ex:'Riesgo típico: errores en lenguaje técnico; privacidad de grabaciones.'},\n {t:'Analítica y alertas de aprendizaje',d:'Procesa datos del LMS para señalar riesgo o participación.',ex:'Riesgo típico: sesgo en los datos; alertas sin acción humana.'}\n];\nvar SRC={directa:'Prueba directa',docs:'Documentación oficial',terceros:'Reseñas de terceros',nocomp:'No comprobado'};\nvar WT={alta:'Peso alto',media:'Peso medio',baja:'Peso bajo'}; var WTV={alta:3,media:2,baja:1};\nvar SUP={baja:'Baja',media:'Media',alta:'Alta'};\nvar FUNCS={gen:'Generación de texto o materiales',conv:'Tutoría conversacional',retro:'Retroalimentación o corrección automática',adapt:'Adaptación de contenido o dificultad',pred:'Predicción o analítica',trans:'Transcripción, traducción o lectura',img:'Generación de imágenes, audio o video',eval:'Evaluación automática'};\nvar CRIT=[\n {id:'nec',n:1,k:'Necesidad educativa que atiende',q:'¿Qué problema concreto dice resolver y cómo se relaciona con tu necesidad?',type:'text',g:0},\n {id:'usr',n:2,k:'Usuario principal',q:'¿Quién la usa directamente y quién recibe el resultado?',type:'user',g:0},\n {id:'fun',n:3,k:'Función de IA',q:'¿Qué hace la IA dentro de la herramienta? Marca las funciones observadas.',type:'func',g:0},\n {id:'uso',n:4,k:'Facilidad de uso',q:'¿Cuánto cuesta empezar, entender el estado y recuperarse de un error?',type:'score',g:1,lv:['Requiere ayuda externa; errores frecuentes','Se aprende con esfuerzo; fricción recurrente','Uso fluido tras una breve exploración','Inmediata e intuitiva para el usuario previsto']},\n {id:'per',n:5,k:'Personalización',q:'¿Se ajusta al nivel, al contexto y a los objetivos del usuario, y quién controla el ajuste?',type:'score',g:1,lv:['Una respuesta igual para todos','Opciones genéricas (idioma, extensión)','Ajuste al nivel y al contexto con control del usuario','Ajuste fino, transparente y modificable por el docente']},\n {id:'acc',n:6,k:'Accesibilidad',q:'¿Funciona con teclado, lector de pantalla, contraste, subtítulos, lenguaje claro?',type:'score',g:1,lv:['Barreras evidentes para algún perf
