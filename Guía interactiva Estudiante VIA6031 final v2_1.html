labs:{
 l2:{sem:2,title:"Laboratorio Conceptual: ¿Qué tipo de IA responde al problema educativo?",dur:"60 a 90 min",
  desc:"Asumes el rol de asesor pedagógico del Instituto Superior Valle Azul, una institución ficticia. Analizas siete situaciones con el mismo esquema de siete elementos y contrastas tus decisiones con una lectura de referencia.",
  pts:["Siete elementos por caso: problema educativo, datos disponibles, tipo de tarea, enfoque de IA, valor pedagógico, limitación y supervisión humana.","El simulador señala incoherencias, por ejemplo un enfoque supervisado sin datos etiquetados. Varios casos admiten más de una respuesta.","Cierras con una transferencia a un problema real de tu contexto, empezando por la pregunta de si de verdad requiere IA. No incluyas datos identificables de estudiantes."],

  desc:"Trabajas con un conjunto ficticio y deliberadamente imperfecto de 240 registros del Instituto Superior Valle Azul. Exploras en Orange y registras aquí lo que encuentras. El simulador lo contrasta con lo que contiene el conjunto.",
  pts:["Siete pasos: importar, variables, faltantes e inconsistencias, visualizaciones, patrones, decisión educativa y límites.","Necesitas Orange Data Mining instalado (es gratuito). El simulador entrega el archivo de datos y un flujo de inicio.","Sin Orange puedes seguir con las visualizaciones de referencia del simulador, pero la actividad pide hacerlo en Orange."],
  out:"Producto: Ficha de Exploración e Interpretación de Datos Educativos, descargable. Valor 0%."},

  desc:"Eliges una necesidad educativa concreta, escribes un primer prompt, evalúas lo que devuelve la herramienta, lo refinas, comparas ambas versiones, verificas y decides qué queda bajo juicio humano. El simulador no genera texto: estructura tu proceso y arma la Matriz de análisis con lo que registres.",
  pts:["Nueve fases: propósito, usuario, prompt inicial, calidad, limitaciones, refinar, comparar, verificar y juicio humano.","Usas una herramienta de IA generativa de tu elección en una ventana aparte y pegas el prompt exacto y el resultado completo.","No incluyas nombres, calificaciones ni descripciones identificables de estudiantes reales en ningún prompt."],

rubrics:[
{id:"R1",sem:1,peso:5,name:"Foro de Reflexión: ¿Toda innovación con IA mejora el aprendizaje?",al:"CLO1, CLO2, CLO3 · PLO1, PLO4",crit:[
["Identificación del problema educativo","Identifica y contextualiza con precisión una necesidad educativa auténtica, significativa y claramente vinculada con la enseñanza o el aprendizaje.","Identifica una necesidad educativa pertinente y presenta suficiente contexto para comprenderla.","La necesidad es general o presenta contextualización limitada.","El problema es confuso, irrelevante o no se relaciona adecuadamente con un contexto educativo."],
["Análisis de la oportunidad de IA","Analiza críticamente si la IA puede aportar valor, diferenciando claramente necesidad educativa, capacidad tecnológica y propósito pedagógico.","Explica de manera apropiada cómo la IA podría contribuir al problema identificado.","La relación entre problema e IA es principalmente descriptiva o poco justificada.","Propone IA sin justificar su pertinencia o se centra exclusivamente en la herramienta."],
["Beneficios, limitaciones y riesgos","Examina equilibradamente beneficios, limitaciones y riesgos, demostrando juicio crítico y comprensión de las capacidades reales de la IA.","Identifica beneficios y riesgos relevantes con razonamiento adecuado.","Reconoce algunos beneficios o riesgos, pero con análisis superficial.","Omite riesgos y limitaciones o presenta afirmaciones poco fundamentadas."],
["Rol y responsabilidad humana","Delimita claramente las decisiones que deben permanecer bajo responsabilidad humana y justifica la necesidad de supervisión profesional.","Reconoce apropiadamente la importancia del juicio y supervisión humana.","Menciona la supervisión humana, pero sin suficiente desarrollo.","Ignora o minimiza la responsabilidad humana."],
["Argumentación e interacción académica","Presenta argumentos coherentes y fundamentados y responde a sus compañeros ampliando significativamente la discusión.","Presenta argumentos claros y participa apropiadamente con sus compañeros.","La argumentación o las respuestas son mayormente descriptivas.","Participación incompleta, superficial o sin interacción significativa."]]},
{id:"R2",sem:2,peso:10,name:"Diagnóstico de Necesidad Educativa y Oportunidad de Integración de IA",al:"CLO2, CLO3 · PLO1, PLO4",crit:[
["Contextualización de la necesidad educativa","Define con precisión contexto, población, problema, consecuencias y procesos de aprendizaje afectados, sustentándolos con evidencia pertinente.","Contextualiza adecuadamente la necesidad con solo omisiones menores.","La contextualización es parcial o presenta evidencia limitada.","El problema carece de definición, contexto o evidencia suficiente."],
["Análisis de la oportunidad de IA","Identifica con precisión la capacidad de IA requerida y demuestra una relación lógica entre problema, datos, función tecnológica y decisión educativa.","Establece una relación apropiada entre necesidad y capacidad de IA.","La relación es plausible pero insuficientemente desarrollada.","La solución tecnológica no corresponde al problema o no está justificada."],
["Justificación pedagógica","Justifica convincentemente por qué la IA aporta un valor educativo adicional y considera alternativas no tecnológicas.","Presenta una justificación pedagógica clara y razonable.","La justificación es general o se centra más en la tecnología que en el aprendizaje.","Carece de fundamentación pedagógica."],
["Análisis inicial de riesgos y límites","Identifica riesgos técnicos, pedagógicos y éticos y delimita apropiadamente decisiones que requieren supervisión humana.","Identifica riesgos y límites pertinentes.","Identifica riesgos básicos con análisis limitado.","Omite riesgos significativos o responsabilidades humanas."],
["Evidencia y comunicación académica","Integra evidencia académica pertinente con excelente organización, redacción y uso de APA.","Utiliza evidencia apropiada y presenta comunicación clara con errores menores.","Evidencia limitada o varios problemas de organización/APA.","Afirmaciones sin sustento, organización deficiente o incumplimiento significativo de estándares académicos."]]},
{id:"R3",sem:4,peso:15,name:"Evaluación Comparativa de Alternativas de IA y Decisión Pedagógica Basada en Evidencia",al:"CLO2, CLO3, CLO4 · PLO1, PLO4, PLO7",crit:[
["Correspondencia entre problema y alternativas","Ambas alternativas responden claramente al problema y son apropiadas para una comparación significativa.","Las alternativas son pertinentes con pequeñas diferencias en su correspondencia.","Una alternativa presenta relación débil con el problema.","Las alternativas son inadecuadas o no comparables."],
["Evaluación técnica y de datos","Analiza rigurosamente capacidades, datos requeridos, desempeño, interpretabilidad y limitaciones de cada alternativa.","Analiza apropiadamente los elementos técnicos esenciales.","Presenta análisis técnico parcial o principalmente descriptivo.","Presenta errores conceptuales significativos o ausencia de análisis técnico."],
["Valor pedagógico y accesibilidad","Compara críticamente valor educativo, necesidades del estudiante, accesibilidad y potencial de apoyo al aprendizaje.","Considera apropiadamente valor pedagógico y accesibilidad.","Considera estos criterios de manera superficial o incompleta.","La evaluación se limita a características tecnológicas."],
["Riesgos y supervisión humana","Identifica riesgos diferenciados para cada alternativa y establece mecanismos claros de supervisión humana.","Reconoce riesgos relevantes y necesidad de supervisión.","Los riesgos se presentan de manera general.","Omite riesgos relevantes o propone automatización sin controles apropiados."],
["Decisión basada en evidencia","Formula una recomendación convincente, equilibrada y sustentada en evidencia pedagógica y tecnológica, reconociendo incertidumbres.","Formula una recomendación coherente y suficientemente sustentada.","La recomendación presenta evidencia limitada o razonamiento incompleto.","La recomendación es arbitraria, contradictoria o no sustentada."],
["Calidad académica","Documento excepcionalmente organizado, analítico y profesional, con fuentes pertinentes y APA correcto.","Documento claro y organizado con errores menores.","Presenta problemas de organización, evidencia o APA.","Carece de calidad académica de nivel de maestría."]]},
{id:"R4",sem:7,peso:15,name:"Evaluación y Selección de una Herramienta de IA para una Necesidad Educativa",al:"CLO2, CLO3, CLO4 · PLO1, PLO4, PLO7",crit:[
["Caracterización de la necesidad y del estudiante","Define claramente contexto, población, necesidad, propósito y resultados esperados, mostrando profunda comprensión de los usuarios.","Define apropiadamente los elementos principales del contexto y la necesidad.","Presenta descripción parcial de contexto o necesidades.","Contexto o necesidad insuficientemente definidos."],
["Evaluación comparativa de herramientas","Compara sistemática y críticamente las herramientas utilizando criterios consistentes y evidencia verificable.","Realiza una comparación clara y suficientemente desarrollada.","Comparación principalmente descriptiva o incompleta.","No existe comparación real o utiliza criterios inconsistentes."],
["Valor pedagógico, personalización y accesibilidad","Evalúa con profundidad la contribución de cada herramienta al aprendizaje, personalización, participación y accesibilidad.","Evalúa apropiadamente estos factores con omisiones menores.","Considera algunos factores de manera superficial.","Ignora necesidades educativas, accesibilidad o personalización."],
["Confiabilidad, privacidad y transparencia","Analiza críticamente calidad, confiabilidad, privacidad, transparencia y limitaciones de cada herramienta.","Analiza adecuadamente los principales aspectos de seguridad y confiabilidad.","Presenta análisis limitado o incompleto.","No considera riesgos relevantes."],
["Selección fundamentada","Selecciona o rechaza una herramienta mediante evidencia sólida, criterios pedagógicos, beneficios, riesgos y delimitación de responsabilidades humanas.","La selección está apropiadamente justificada.","La selección presenta justificación limitada.","La decisión no está justificada o responde principalmente a preferencias personales."],
["Comunicación académica","Presentación escrita rigurosa, coherente, profesional y sustentada en literatura pertinente.","Comunicación clara y organizada con errores menores.","Algunos problemas de organización o sustentación.","Comunicación deficiente o evidencia académica insuficiente."]]},
{id:"R5",sem:9,peso:15,name:"Análisis Ético, de Riesgos y Estrategias de Mitigación de la Solución de IA",al:"CLO3, CLO4 · PLO4, PLO7",crit:[
["Identificación integral de riesgos","Identifica y analiza de manera sistémica riesgos técnicos, pedagógicos, éticos, sociales e institucionales pertinentes al contexto.","Identifica y analiza los principales riesgos relevantes.","Identifica algunos riesgos, pero con análisis incompleto.","Omite riesgos significativos o los aborda superficialmente."],
["Privacidad, seguridad y protección de datos","Examina rigurosamente datos utilizados, privacidad, seguridad, consentimiento y posibles exposiciones de información.","Considera adecuadamente privacidad y seguridad.","El análisis es básico o incompleto.","Ignora aspectos esenciales de privacidad o seguridad."],
["Sesgo, equidad, inclusión y accesibilidad","Analiza posibles impactos diferenciales sobre poblaciones diversas y propone medidas concretas de equidad e inclusión.","Reconoce apropiadamente riesgos de sesgo, equidad e inclusión.","Considera estos aspectos de manera general.","Omite impactos sobre poblaciones diversas."],
["Estrategias de mitigación","Propone controles específicos, viables, verificables y directamente relacionados con cada riesgo identificado.","Propone estrategias apropiadas para los principales riesgos.","Algunas estrategias son generales o difíciles de verificar.","Estrategias ausentes, inadecuadas o desconectadas de los riesgos."],
["Supervisión y responsabilidad humana","Define claramente límites de automatización, responsables, mecanismos de verificación, revisión y rendición de cuentas.","Define adecuadamente responsabilidades humanas esenciales.","Las responsabilidades están parcialmente delimitadas.","No existe una estructura clara de supervisión o responsabilidad."],
["Argumentación ética y evidencia","Integra principios éticos, evidencia y razonamiento profesional de manera rigurosa para justificar decisiones.","Presenta argumentación ética apropiada y respaldada.","Argumentación limitada o poco sustentada.","Las decisiones se basan principalmente en opinión o conveniencia tecnológica."]]},
{id:"R6",sem:10,peso:20,name:"Evaluación Final Integradora, Parte A: Propuesta Final de Integración Educativa de IA",al:"CLO1, CLO2, CLO3, CLO4 · PLO1, PLO4, PLO7",crit:[
["Integración y coherencia de la propuesta","Integra excepcionalmente todas las etapas del proyecto en una propuesta lógica, coherente y profesional; cada sección se deriva claramente de la anterior.","La propuesta está bien integrada con inconsistencias menores.","Presenta integración parcial y algunas desconexiones entre componentes.","La propuesta carece de coherencia, integración o componentes esenciales."],
["Problema, contexto y necesidades educativas","Define y fundamenta rigurosamente problema, población, contexto, evidencia e impacto educativo.","Presenta un análisis claro y apropiadamente fundamentado.","El análisis es parcial o presenta evidencia limitada.","El problema o contexto no están adecuadamente fundamentados."],
["Comprensión y selección de IA","Demuestra dominio conceptual de capacidades y limitaciones de IA y selecciona una solución claramente relacionada con la necesidad educativa.","Selecciona apropiadamente una solución y explica sus principales capacidades.","La selección es plausible pero presenta análisis conceptual limitado.","La solución no corresponde al problema o refleja errores conceptuales importantes."],
["Evaluación de alternativas y evidencia","Compara críticamente alternativas mediante criterios consistentes y utiliza evidencia sólida para justificar la elección final.","La comparación y justificación son apropiadas.","Comparación limitada o evidencia insuficientemente integrada.","La selección se realiza sin comparación o sustento adecuado."],
["Valor pedagógico y enfoque centrado en el estudiante","Demuestra una relación excepcional entre solución, necesidades del estudiante, aprendizaje, personalización y propósito educativo.","Presenta una relación clara entre solución y valor pedagógico.","El valor pedagógico está parcialmente desarrollado.","Predomina un enfoque centrado en la herramienta."],
["Accesibilidad, inclusión y equidad","Integra sistemáticamente criterios de accesibilidad, inclusión, diversidad y equidad y propone alternativas ante posibles barreras.","Considera adecuadamente estos criterios.","Los aborda parcialmente.","Los criterios de accesibilidad e inclusión están ausentes o mínimamente considerados."],
["Ética y gestión de riesgos","Integra un análisis riguroso de privacidad, seguridad, sesgo, transparencia, integridad académica y estrategias de mitigación.","Analiza apropiadamente los principales riesgos.","Análisis ético parcial o con medidas generales.","Riesgos y responsabilidades insuficientemente considerados."],
["Supervisión y responsabilidad humana","Delimita con precisión qué puede realizar la IA, qué requiere validación y qué decisiones deben permanecer bajo responsabilidad humana.","Define adecuadamente la supervisión humana.","Delimitación parcial de responsabilidades.","No diferencia apropiadamente responsabilidad humana y automatización."],
["Viabilidad y recomendación final","Formula una recomendación realista, contextualizada, basada en evidencia y acompañada de condiciones claras de uso, monitoreo y revisión.","La recomendación es viable y suficientemente justificada.","La recomendación requiere mayor desarrollo o precisión.","La recomendación es poco viable o carece de fundamento."],
["Calidad académica y APA","Documento excepcionalmente organizado, profesional, analítico y plenamente consistente con estándares académicos y APA 7.","Presentación profesional con errores menores.","Varios problemas de organización, redacción o APA reducen claridad.","La calidad escrita no alcanza las expectativas de nivel de maestría."]]},
{id:"R7",sem:10,peso:10,name:"Evaluación Final Integradora, Parte B: Presentación y Defensa Profesional",al:"CLO2, CLO3, CLO4 · PLO4, PLO7",crit:[
["Organización y síntesis de la presentación","Presentación excepcionalmente organizada que sintetiza problema, evidencia, alternativas, solución, riesgos y recomendación mediante una secuencia lógica.","Presentación clara y organizada con omisiones menores.","Organización comprensible pero inconsistente o excesivamente descriptiva.","Presentación desorganizada, incompleta o difícil de seguir."],
["Dominio conceptual de IA y educación","Demuestra dominio profundo de fundamentos, capacidades, limitaciones y aplicaciones educativas de IA.","Demuestra comprensión sólida de los conceptos principales.","Presenta dominio parcial o algunas imprecisiones.","Evidencia comprensión limitada o errores conceptuales significativos."],
["Justificación de la solución recomendada","Defiende de manera convincente la selección mediante evidencia, criterios pedagógicos, tecnológicos, de accesibilidad y viabilidad.","Justifica apropiadamente la decisión mediante evidencia relevante.","La justificación es parcial o poco integrada.","La recomendación carece de fundamentación suficiente."],
["Ética, riesgos y responsabilidad humana","Explica con precisión riesgos, estrategias de mitigación, límites de automatización y responsabilidades humanas.","Aborda adecuadamente los principales riesgos y responsabilidades.","Presenta análisis ético limitado.","No demuestra comprensión suficiente de riesgos o responsabilidad profesional."],
["Pensamiento crítico y respuesta a preguntas","Responde con precisión y profundidad, considera alternativas, reconoce límites y modifica razonablemente su posición cuando la evidencia lo exige.","Responde apropiadamente a las preguntas y justifica la mayoría de sus decisiones.","Respuestas parciales o con limitada profundidad analítica.","No puede justificar adecuadamente sus decisiones o responder preguntas fundamentales."],
["Comunicación profesional","Comunica con excepcional claridad, precisión, seguridad y vocabulario académico apropiado al nivel de maestría.","Comunicación clara y profesional.","Comunicación comprensible pero con problemas de precisión o seguridad.","Comunicación confusa, desorganizada o poco profesional."],
["Recursos visuales","Recursos profesionales, accesibles, sintéticos y directamente vinculados con los argumentos de la defensa.","Los recursos apoyan apropiadamente la presentación.","Recursos funcionales pero con problemas de claridad o integración.","Recursos ausentes, inaccesibles o que dificultan la comprensión."]]}
],

done\">\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"5\">\u003cspan class=\"n\">06\u003c/span>Transferencia a tu contexto\u003cspan class=\"done\">\u003c/span>\u003c/button>\n    \u003cbutton class=\"tab\" data-tab=\"6\">\u003cspan class=\"n\">07\u003c/span>Informe y evidencias\u003cspan class=\"done\">\u003c/span>\u003c/button>\n  \u003c/nav>\n\u003c/header>\n\n\u003cmain>\n\u003c!-- ================= 01 FUNDAMENTO ================= -->\n\u003csection class=\"panel active\" data-panel=\"0\">\n  \u003cdiv class=\"eyebrow\">Carpeta pedagógica · Laboratorio conceptual\u003c/div>\n  \u003ch1 class=\"title\">¿Qué tipo de IA responde al problema educativo?\u003c/h1>\n  \u003cp class=\"lede\">Antes de abrir una herramienta conviene entender la lógica del modelo que hay detrás: qué problema intenta resolver, con qué datos aprende, qué tipo de tarea ejecuta, qué decisión puede apoyar y qué decisión no debería tomar nunca por sí solo. Este laboratorio recorre siete situaciones educativas frecuentes y pide, para cada una, el mismo análisis de siete elementos. Lo que se evalúa es la coherencia del razonamiento, no el dominio técnico.\u003c/p>\n\n  \u003cdiv class=\"card accent\" style=\"margin-bottom:26px;\">\n    \u003cdiv class=\"label\">Pregunta orientadora\u003c/div>\n    \u003cp class=\"hero-q\">\"¿Qué situación requiere atención, qué datos la describen, qué tipo de tarea ejecutaría un modelo, qué decisión pedagógica apoyaría y quién debe interpretar lo que el sistema produce?\"\u003c/p>\n  \u003c/div>\n\n  \u003ch2>Seis lentes para razonar antes de la herramienta\u003c/h2>\n  \u003cp class=\"muted\" style=\"margin:0 0 16px; font-size:14px;\">Cada elemento del análisis dialoga con una tradición de investigación. Lo que se evalúa es la capacidad de usarlas como criterios explícitos, no de citarlas.\u003c/p>\n\n  \u003cdiv class=\"stack\">\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">1\u003c/div>\u003cdiv>\n      \u003ch3>Primero el problema educativo, después la tecnología\u003c/h3>\n      \u003cdiv class=\"cite\">Luckin, Holmes, Griffiths y Forcier (2016) · Selwyn (2019) · UNESCO (2021)\u003c/div>\n      \u003cp>La pregunta inicial no es \"qué puede hacer la IA\" sino \"qué situación educativa requiere atención y por qué\". Luckin y colaboradores distinguen entre sistemas centrados en el aprendiz, en el docente y en el sistema; Selwyn advierte que muchas aplicaciones llegan como soluciones en busca de problema. La guía de UNESCO sitúa el valor de la IA en apoyar decisiones humanas, no en reemplazarlas. Un problema mal formulado produce un modelo que responde a la pregunta equivocada.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Elemento 1 · Problema educativo\u003c/b>Formula la situación en términos de aprendizaje, permanencia o experiencia de los estudiantes, con el nivel de decisión que afecta: aula, tutoría, curso o institución.\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">2\u003c/div>\u003cdiv>\n      \u003ch3>Los datos: qué existe, qué mide realmente y qué cuesta usar\u003c/h3>\n      \u003cdiv class=\"cite\">Siemens (2013) · Romero y Ventura (2020) · Slade y Prinsloo (2013)\u003c/div>\n      \u003cp>La analítica del aprendizaje y la minería de datos educativos trabajan con huellas: accesos, entregas, calificaciones, mensajes, respuestas. Cada huella es un indicador indirecto (un \u003cem>proxy\u003c/em>) de algo más difícil de observar —comprensión, compromiso, dificultad— y conviene no confundir el proxy con el fenómeno. Slade y Prinsloo recuerdan que el estudiante es dueño de su información y que el consentimiento, la transparencia y la posibilidad de rectificar son condiciones, no detalles.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Elemento 2 · Tipo de datos disponibles\u003c/b>Selecciona los datos pertinentes al problema, no todos los que existen. Pregunta qué mide cada uno, con qué cobertura y a qué costo para la privacidad.\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">3\u003c/div>\u003cdiv>\n      \u003ch3>Tipos de tarea y de aprendizaje automático\u003c/h3>\n      \u003cdiv class=\"cite\">Jordan y Mitchell (2015) · Romero y Ventura (2020)\u003c/div>\n      \u003cp>Un modelo \u003cstrong>supervisado\u003c/strong> aprende de ejemplos etiquetados —casos del pasado cuyo resultado se conoce— y produce una \u003cstrong>clasificación\u003c/strong> (una categoría: riesgo alto o bajo, respuesta correcta o incorrecta) o una \u003cstrong>regresión\u003c/strong> (un número: nota estimada, probabilidad). Un modelo \u003cstrong>no supervisado\u003c/strong> no tiene etiquetas: busca estructura en los datos, por ejemplo \u003cstrong>agrupamientos\u003c/strong> o \u003cstrong>patrones\u003c/strong> recurrentes, que después alguien debe interpretar. Los \u003cstrong>sistemas de recomendación\u003c/strong> combinan ambos enfoques para sugerir recursos por similitud. El \u003cstrong>procesamiento de lenguaje natural\u003c/strong> y la \u003cstrong>IA generativa\u003c/strong> trabajan con texto. Y a veces basta una \u003cstrong>analítica descriptiva\u003c/strong> o un conjunto de \u003cstrong>reglas\u003c/strong>: no todo problema necesita un modelo que aprenda. \"Predecir\" es un propósito; clasificación o regresión son la forma de hacerlo.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Elementos 3 y 4 · Tipo de tarea y enfoque de IA\u003c/b>Un enfoque supervisado exige etiquetas históricas: si no existen ejemplos con resultado conocido, no hay de qué aprender. Verifica siempre esa condición antes de elegirlo.\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">4\u003c/div>\u003cdiv>\n      \u003ch3>Valor pedagógico: qué decisión apoya y a quién sirve\u003c/h3>\n      \u003cdiv class=\"cite\">Arnold y Pistilli (2012) · Holmes, Bialik y Fadel (2019)\u003c/div>\n      \u003cp>El sistema Course Signals de Purdue mostró que una alerta temprana solo tiene valor cuando alguien actúa sobre ella y el estudiante recibe un mensaje que puede usar. Holmes y colaboradores insisten en que la IA educativa debe evaluarse por la decisión pedagógica que mejora —a quién acompañar, qué reenseñar, qué recurso sugerir— y no por la sofisticación del modelo. Un resultado que nadie puede traducir en acción es ruido.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Elemento 5 · Valor pedagógico\u003c/b>Nombra la decisión concreta que el resultado permitiría tomar mejor o antes, y quién la toma.\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">5\u003c/div>\u003cdiv>\n      \u003ch3>Limitaciones: correlación, sesgo y lo que no debe automatizarse\u003c/h3>\n      \u003cdiv class=\"cite\">Baker y Hawn (2022) · Slade y Prinsloo (2013)\u003c/div>\n      \u003cp>Los modelos aprenden regularidades del pasado; si el pasado fue desigual, el modelo reproduce la desigualdad. Baker y Hawn documentan sesgos algorítmicos en educación por origen, género, lengua, discapacidad y condición socioeconómica, muchas veces porque esos atributos —o sus sustitutos— entraron como predictores. Además, una correlación no es una causa: que los estudiantes que entran poco a la plataforma abandonen más no significa que entrar más evite el abandono. Por eso hay decisiones que un sistema no debería tomar solo: etiquetar a una persona ante otros, asignar una calificación, cerrar una ruta o elegir una intervención sin contexto.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Elemento 6 · Limitación\u003c/b>Identifica qué no debe decidir automáticamente el sistema en ese caso. \"Nada, puede automatizarse\" nunca es la respuesta.\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card theory\">\u003cdiv class=\"n\">6\u003c/div>\u003cdiv>\n      \u003ch3>Supervisión humana: quién interpreta y valida\u003c/h3>\n      \u003cdiv class=\"cite\">Molenaar (2022) · UNESCO (2021)\u003c/div>\n      \u003cp>Molenaar propone pensar la relación humano-IA como un continuo de control compartido, en el que la automatización cambia según la tarea y las consecuencias. El resultado de un modelo es una hipótesis que alguien con conocimiento del contexto —el docente, la tutoría, un comité, el propio estudiante acompañado— debe interpretar, contrastar y, si corresponde, descartar. La supervisión no es un trámite al final: define quién responde por lo que el sistema sugiere.\u003c/p>\n      \u003cdiv class=\"apply\">\u003cb>Elemento 7 · Supervisión humana\u003c/b>Elige a quien tiene el contexto y la responsabilidad para validar el resultado antes de que produzca una consecuencia para el estudiante.\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\n  \u003ch2 style=\"margin-top:28px;\">Referencias de la carpeta\u003c/h2>\n  \u003cdiv class=\"card refs\">\u003cul id=\"refsList\">\u003c/ul>\u003c/div>\n  \u003cdiv class=\"nav-row\">\u003cspan>\u003c/span>\u003cbutton class=\"pill-btn primary goto\" data-goto=\"1\">Instrucciones →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 02 INSTRUCCIONES ================= -->\n\u003csection class=\"panel\" data-panel=\"1\">\n  \u003cdiv class=\"eyebrow\">Instrucciones de uso\u003c/div>\n  \u003ch1 class=\"title\">Cómo se recorre el laboratorio\u003c/h1>\n  \u003cp class=\"lede\">Asumes el rol de asesor o asesora pedagógica de una institución que quiere \"usar inteligencia artificial\" para atender siete situaciones educativas. Para cada situación completarás el mismo análisis de siete elementos. El laboratorio contrasta después tus decisiones con una lectura de referencia y señala incoherencias: por ejemplo, un enfoque supervisado sin datos etiquetados, o datos sensibles usados como predictores.\u003c/p>\n  \u003cdiv class=\"grid g2\" style=\"margin-bottom:18px;\">\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"label\">Los siete elementos del análisis\u003c/div>\n      \u003cdiv class=\"flow-strip\">\u003cspan class=\"fs\">Problema educativo\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">Datos disponibles\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">Tipo de tarea\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">Enfoque de IA\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">Valor pedagógico\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">Limitación\u003c/span>\u003cspan class=\"ar\">→\u003c/span>\u003cspan class=\"fs\">Supervisión humana\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card accent\">\n      \u003cdiv class=\"label\">Lo que el laboratorio no hace\u003c/div>\n      \u003cp style=\"margin:0; font-size:13.5px; color:var(--ink);\">No entrena modelos ni usa herramientas. Tampoco hay una única respuesta: varios casos admiten más de un tipo de tarea o enfoque, y la referencia lo reconoce. Lo que se mide es la \u003cstrong>coincidencia con la lógica de referencia\u003c/strong> y la ausencia de incoherencias, no el acierto técnico.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-bottom:18px;\">\n    \u003cdiv class=\"label\">Pasos\u003c/div>\n    \u003col class=\"steps\">\n      \u003cli>\u003cb>Lee el fundamento teórico\u003c/b> (01) y ubica qué lente corresponde a cada elemento.\u003c/li>\n      \u003cli>\u003cb>Estudia el escenario y el inventario de datos\u003c/b> (03): doce fuentes con notas sobre cobertura, calidad y sensibilidad. No todas sirven para todo.\u003c/li>\n      \u003cli>\u003cb>Recorre los siete casos\u003c/b> (04). Para cada uno: describe el problema, selecciona los datos, elige el tipo de tarea y el enfoque, marca las decisiones que apoyaría, señala lo que no debe automatizarse, asigna la supervisión y justifica en pocas líneas.\u003c/li>\n      \u003cli>\u003cb>Contrasta con la lectura de referencia\u003c/b> (05): coincidencia por elemento, alertas de incoherencia y un mapa que ubica tus siete casos por enfoque.\u003c/li>\n      \u003cli>\u003cb>Transfiere el análisis a tu contexto\u003c/b> (06): un problema real de tu institución con los mismos siete elementos y una pregunta previa: ¿requiere IA?\u003c/li>\n      \u003cli>\u003cb>Descarga el informe\u003c/b> (07) como evidencia de aprendizaje.\u003c/li>\n    \u003c/ol>\n  \u003c/div>\n  \u003cdiv class=\"grid g3\">\n    \u003cdiv class=\"card tight\">\u003cdiv class=\"label\">Guardado\u003c/div>\u003cp style=\"margin:0; font-size:13px; color:var(--ink);\">El avance se guarda en este navegador. \"Reiniciar\" borra todo tras confirmar.\u003c/p>\u003c/div>\n    \u003cdiv class=\"card tight\">\u003cdiv class=\"label\">Duración estimada\u003c/div>\u003cp style=\"margin:0; font-size:13px; color:var(--ink);\">60 a 90 minutos; puede completarse en varias sesiones.\u003c/p>\u003c/div>\n    \u003cdiv class=\"card tight warn\">\u003cdiv class=\"label\">Datos reales\u003c/div>\u003cp style=\"margin:0; font-size:13px; color:var(--ink);\">En la transferencia no incluyas datos identificables de estudiantes reales.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"nav-row\">\u003cbutton class=\"pill-btn goto\" data-goto=\"0\">← Fundamento\u003c/button>\u003cbutton class=\"pill-btn primary goto\" data-goto=\"2\">Ver el escenario →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 03 ESCENARIO ================= -->\n\u003csection class=\"panel\" data-panel=\"2\">\n  \u003cdiv class=\"eyebrow\">Escenario institucional\u003c/div>\n  \u003ch1 class=\"title\">Instituto Superior Valle Azul · Programa \"Datos para Acompañar\"\u003c/h1>\n  \u003cp class=\"lede\">Un instituto de educación superior con \u003cstrong>6 200 estudiantes\u003c/strong> en programas presenciales y virtuales recibió fondos para \"incorporar inteligencia artificial al acompañamiento académico\". La vicerrectoría reunió siete situaciones que distintas áreas quieren atender y te pidió, como asesor o asesora pedagógica, que determines \u003cstrong>qué tipo de enfoque de IA sería pertinente para cada una\u003c/strong> antes de evaluar herramientas o proveedores.\u003c/p>\n  \u003cdiv class=\"grid g3\" style=\"margin-bottom:18px;\">\n    \u003cdiv class=\"card tight\">\u003cdiv class=\"label\">Lo que pide la vicerrectoría\u003c/div>\u003cp style=\"margin:0; font-size:13px; color:var(--ink);\">\"Una recomendación por situación: qué haría la IA, con qué datos, para apoyar qué decisión y bajo qué control.\"\u003c/p>\u003c/div>\n    \u003cdiv class=\"card tight\">\u003cdiv class=\"label\">Lo que ya existe\u003c/div>\u003cp style=\"margin:0; font-size:13px; color:var(--ink);\">Un LMS con cuatro años de registros, un sistema académico con historial de calificaciones y matrícula, y una unidad de tutoría con tres personas.\u003c/p>\u003c/div>\n    \u003cdiv class=\"card tight warn\">\u003cdiv class=\"label\">Lo que no se sabe\u003c/div>\u003cp style=\"margin:0; font-size:13px; color:var(--ink);\">No hay política de uso de datos ni comité de ética. Ningún docente ha sido consultado sobre qué haría con un resultado automático.\u003c/p>\u003c/div>\n  \u003c/div>\n\n  \u003ch2>Inventario de datos disponibles\u003c/h2>\n  \u003cp class=\"muted\" style=\"margin:0 0 14px; font-size:14px;\">Doce fuentes. Las notas en ámbar señalan limitaciones de cobertura o calidad; las marcadas como sensibles exigen una justificación especial antes de entrar en cualquier modelo.\u003c/p>\n  \u003cdiv class=\"card\" style=\"margin-bottom:22px;\" id=\"inventory\">\u003c/div>\n\n  \u003ch2>Las siete situaciones\u003c/h2>\n  \u003cp class=\"muted\" style=\"margin:0 0 14px; font-size:14px;\">Cada caso lo plantea un área distinta, con sus propias expectativas sobre lo que la IA \"debería\" hacer. Parte del trabajo es traducir esa expectativa a un problema formulable.\u003c/p>\n  \u003cdiv class=\"grid g2\" id=\"caseCards\">\u003c/div>\n  \u003cdiv class=\"nav-row\">\u003cbutton class=\"pill-btn goto\" data-goto=\"1\">← Instrucciones\u003c/button>\u003cbutton class=\"pill-btn primary goto\" data-goto=\"3\">Ir al laboratorio →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 04 LABORATORIO ================= -->\n\u003csection class=\"panel\" data-panel=\"3\">\n  \u003cdiv class=\"eyebrow\">Laboratorio conceptual\u003c/div>\n  \u003ch1 class=\"title\">Siete casos, un mismo análisis\u003c/h1>\n  \u003cdiv class=\"stepper\" id=\"stepper\">\u003c/div>\n  \u003cdiv id=\"labBody\">\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 05 LECTURA DE REFERENCIA ================= -->\n\u003csection class=\"panel\" data-panel=\"4\">\n  \u003cdiv class=\"eyebrow\">Lectura de referencia\u003c/div>\n  \u003ch1 class=\"title\">Tu análisis frente a la lógica de referencia\u003c/h1>\n  \u003cp class=\"lede\">La referencia no es la única respuesta válida: donde un caso admite varios tipos de tarea o enfoques, se aceptan. La coincidencia resume cuánto se alinea tu análisis con esa lectura; las alertas señalan incoherencias que convendría revisar antes de usar cualquier herramienta.\u003c/p>\n  \u003cdiv class=\"grid g3\" style=\"margin-bottom:22px;\" id=\"kpis\">\u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-bottom:22px;\">\n    \u003cdiv class=\"label\">Mapa de enfoques · tus siete casos\u003c/div>\n    \u003cp class=\"muted\" style=\"font-size:13px; margin:0 0 12px;\">El punto azul es tu elección; el anillo turquesa, los enfoques aceptados por la referencia. Un punto dentro del anillo indica coincidencia.\u003c/p>\n    \u003cdiv class=\"mtx-wrap\" id=\"approachMap\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"stack\" id=\"results\">\u003c/div>\n  \u003cdiv class=\"nav-row\">\u003cbutton class=\"pill-btn goto\" data-goto=\"3\">← Laboratorio\u003c/button>\u003cbutton class=\"pill-btn primary goto\" data-goto=\"5\">Transferir a mi contexto →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 06 TRANSFERENCIA ================= -->\n\u003csection class=\"panel\" data-panel=\"5\">\n  \u003cdiv class=\"eyebrow\">Transferencia a tu contexto\u003c/div>\n  \u003ch1 class=\"title\">El mismo análisis, tu problema\u003c/h1>\n  \u003cp class=\"lede\">Aplica los siete elementos a una situación educativa real de tu institución o práctica. La primera pregunta decide si el resto del análisis tiene sentido.\u003c/p>\n  \u003cdiv class=\"card\" style=\"margin-bottom:14px;\">\n    \u003cdiv class=\"grid g2\" style=\"gap:12px;\">\n      \u003cdiv class=\"field\">\u003cspan class=\"fl\">Institución o contexto (sin datos identificables)\u003c/span>\u003cinput type=\"text\" data-ref=\"t_ctx\" placeholder=\"Ej.: programa virtual de formación docente, 400 estudiantes\">\u003c/div>\n      \u003cdiv class=\"field\">\u003cspan class=\"fl\">Situación que requiere atención\u003c/span>\u003cinput type=\"text\" data-ref=\"t_sit\" placeholder=\"Ej.: entregas tardías crecientes en el segundo módulo\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"card accent\" style=\"margin-bottom:14px;\">\n    \u003cdiv class=\"label\">Pregunta decisiva\u003c/div>\n    \u003cp class=\"hero-q\" style=\"margin-bottom:12px;\">¿Requiere realmente un modelo de IA esta situación?\u003c/p>\n    \u003cdiv class=\"seg\" data-kind=\"transfer\" data-field=\"needs\" id=\"transferSeg\">\u003cbutton type=\"button\" data-v=\"si\">Sí: hay un patrón que un modelo puede aprender y una decisión que apoyar\u003c/button>\u003cbutton type=\"button\" data-v=\"no\">No: una analítica descriptiva o una intervención pedagógica basta\u003c/button>\u003c/div>\n    \u003cp class=\"note\" style=\"margin:10px 0 0;\">Ambas respuestas exigen fundamentación. Un informe que concluye \"no requiere IA\" es un resultado válido del laboratorio.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-bottom:14px;\" id=\"transferTable\">\u003c/div>\n  \u003cdiv class=\"card\">\u003cdiv class=\"field\">\u003cspan class=\"fl\">Fundamentación de la respuesta a la pregunta decisiva\u003c/span>\u003ctextarea data-ref=\"t_why\" placeholder=\"Por qué sí requiere un modelo (qué aprendería, de qué ejemplos) o por qué no (qué basta para tomar la decisión)\">\u003c/textarea>\u003c/div>\u003c/div>\n  \u003cdiv class=\"nav-row\">\u003cbutton class=\"pill-btn goto\" data-goto=\"4\">← Lectura de referencia\u003c/button>\u003cbutton class=\"pill-btn primary goto\" data-goto=\"6\">Preparar el informe →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 07 INFORME ================= -->\n\u003csection class=\"panel\" data-panel=\"6\">\n  \u003cdiv class=\"eyebrow\">Informe y evidencias\u003c/div>\n  \u003ch1 class=\"title\">Descarga el Informe del Laboratorio Conceptual\u003c/h1>\n  \u003cp class=\"lede\">El archivo reúne los siete análisis con su lectura de referencia, las alertas de coherencia, la transferencia a tu contexto y las referencias de la carpeta. Sirve como evidencia de aprendizaje para el curso.\u003c/p>\n  \u003cdiv class=\"grid g2\" style=\"margin-bottom:18px;\">\n    \u003cdiv class=\"card\">\u003cdiv class=\"grid\" style=\"gap:12px;\">\n      \u003cdiv class=\"field\">\u003cspan class=\"fl\">Nombre del maestrante\u003c/span>\u003cinput type=\"text\" data-ref=\"nombre\" placeholder=\"Nombre y apellido\">\u003c/div>\n      \u003cdiv class=\"field\">\u003cspan class=\"fl\">Programa / cohorte (opcional)\u003c/span>\u003cinput type=\"text\" data-ref=\"programa\" placeholder=\"Ej.: Maestría en ... — cohorte ...\">\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"card\">\u003cdiv class=\"label\">Estado del informe\u003c/div>\u003cdiv id=\"checklist\" style=\"font-size:13.5px; line-height:1.9;\">\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"row\">\n    \u003cbutton class=\"pill-btn primary\" id=\"btnDownload\" style=\"padding:13px 22px; font-size:14px;\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3v12\"/>\u003cpolyline points=\"6 11 12 17 18 11\"/>\u003cpath d=\"M4 21h16\"/>\u003c/svg>Descargar informe (.html)\u003c/button>\n    \u003cspan class=\"note\">Cada descarga refleja el estado actual de tus análisis.\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"nav-row\">\u003cbutton class=\"pill-btn goto\" data-goto=\"5\">← Transferencia\u003c/button>\u003cspan>\u003c/span>\u003c/div>\n\u003c/section>\n\u003c/main>\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\n\u003cscript>\n(function(){\n'use strict';\nvar STORE_KEY='biu_lab_conceptual_ia_v1';\n\n/* ================= DATA ================= */\nvar DATA=[\n {id:'d1',nm:'Registros del LMS (accesos, tiempo, recursos abiertos)',nt:'Semanal, cuatro años. Mide actividad en plataforma, [u]no comprensión[/u].'},\n {id:'d2',nm:'Entregas de tareas (fechas, retrasos, faltantes)',nt:'Completo para cursos virtuales; [u]parcial en presenciales[/u].'},\n {id:'d3',nm:'Calificaciones parciales y finales históricas',nt:'Tres años, todos los programas. Resultado conocido por estudiante y curso.'},\n {id:'d4',nm:'Historial de matrícula, retiros y abandono',nt:'Cinco años. Indica quién abandonó y cuándo: [u]sin el motivo[/u].'},\n {id:'d5',nm:'Participación en foros (mensajes, respuestas, texto)',nt:'Solo cursos virtuales. Incluye el texto completo de los mensajes.'},\n {id:'d6',nm:'Respuestas abiertas a cuestionarios y exámenes (texto)',nt:'Dos cursos tienen ≈1 800 respuestas ya calificadas por docentes con rúbrica; [u]el resto, sin calificar[/u].'},\n {id:'d7',nm:'Resultados ítem por ítem de las evaluaciones',nt:'Qué preguntas falla cada estudiante, por tema. Disponible en cursos con cuestionarios en línea.'},\n {id:'d8',nm:'Datos sociodemográficos (edad, género, zona, beca)',nt:'Completo. [u]Usarlos como predictores reproduce desigualdades[/u]; sirven para auditar si el modelo trata igual a todos.',sens:true},\n {id:'d9',nm:'Asistencia a sesiones sincrónicas',nt:'Registrada automáticamente; [u]no distingue conexión de atención[/u].'},\n {id:'d10',nm:'Encuesta de satisfacción y autoeficacia',nt:'Semestral; [u]18 % de respuesta[/u]. Cobertura insuficiente para modelar.'},\n {id:'d11',nm:'Catálogo de recursos (tema, nivel, formato) y valoraciones',nt:'Etiquetado completo; [u]pocas valoraciones de estudiantes[/u].'},\n {id:'d12',nm:'Tickets de soporte y tutoría (motivo, fecha)',nt:'Dos años. Señal temprana de dificultad, [u]solo de quien pide ayuda[/u].'}\n];\nvar TASKS={t1:'Clasificación',t2:'Regresión',t3:'Agrupamiento',t4:'Recomendación',t5:'Detección de patrones o anomalías',t6:'Procesamiento de lenguaje natural',t7:'Analítica descriptiva (sin modelo que aprenda)'};\nvar APPR={a1:'Supervisado',a2:'No supervisado',a3:'Semisupervisado',a4:'Por refuerzo',a5:'IA generativa (LLM)',a6:'Reglas o umbrales (sin aprendizaje)',a7:'Híbrido'};\nvar VALS={v1:'Priorizar a quién contactar o acompañar',v2:'Ajustar la enseñanza o el diseño del curso',v3:'Asignar recursos o apoyos',v4:'Retroalimentar u orientar al estudiante',v5:'Formar grupos de trabajo',v6:'Calificar o certificar el logro',v7:'Sancionar o restringir'};\nvar LIMS={l1:'Etiquetar al estudiante ante otros o cerrar expectativas sobre él',l2:'Asignar la calificación o certificar el logro',l3:'Negar acceso, imponer una ruta o excluir',l4:'Elegir la intervención sin conocer el contexto del estudiante',l5:'Afirmar causas a partir de correlaciones',l6:'Nada: el sistema puede decidir por completo'};\nvar SUPS={s1:'Docente del curso',s2:'Tutoría, consejería o bienestar',s3:'Coordinación o comité académico',s4:'Analista de datos junto con el docente',s5:'El propio estudiante, con acompañamiento',s6:'Nadie: el sistema es suficientemente confiable'};\n\nvar CASES=[\n {k:'1',short:'Riesgo de abandono',title:'Estudiantes con riesgo de abandono',who:'Lo plantea Tutoría',ctx:'\"Cuando nos enteramos de que alguien dejó de entrar ya es tarde. Queremos saber en la semana 3 quién va a abandonar para llamarlo.\" La unidad tiene tres personas para 6 200 estudiantes.',expect:'Tutoría espera una lista de nombres con un semáforo.',\n  ref:{datos:['d1','d2','d4','d9','d12'],datosOpt:['d3'],labels:['d4'],tarea:['t1'],tareaOpt:['t2'],enf:['a1'],enfOpt:['a7'],valor:['v1','v3'],lim:['l1','l4','l5'],sup:['s2'],supOpt:['s4']},\n  logic:'Hay ejemplos históricos con resultado conocido (quién abandonó: d4), así que un modelo \u003cb>supervisado de clasificación\u003c/b> puede aprender qué señales tempranas (accesos, entregas, asistencia, tickets) se asociaron con abandono. Produce una probabilidad, no un destino. Course Signals (Arnold y Pistilli, 2012) mostró que la alerta solo tiene valor si alguien contacta al estudiante con un mensaje útil: por eso la decisión que apoya es \u003cb>a quién acompañar primero\u003c/b> y la supervisión corresponde a \u003cb>Tutoría\u003c/b>. Los datos sociodemográficos no deben entrar como predictores (Baker y Hawn, 2022): sirven para auditar si el modelo falla más con algún grupo. El sistema no debe etiquetar, elegir la intervención ni explicar la causa: la correlación entre inactividad y abandono no dice por qué.'},\n {k:'2',short:'Agrupamiento por patrones',title:'Agrupamiento de estudiantes según patrones de aprendizaje',who:'Lo plantea la Dirección de Educación Virtual',ctx:'\"Sabemos que no todos estudian igual: unos entran de madrugada y entregan tarde, otros solo leen, otros viven en el foro. Queremos agruparlos para diseñar mejor los cursos.\"',expect:'La dirección espera \"perfiles de estudiante\" para asignar rutas distintas.',\n  ref:{datos:['d1','d2','d5','d7','d9'],datosOpt:['d3'],labels:[],tarea:['t3'],tareaOpt:['t5'],enf:['a2'],enfOpt:[],valor:['v2','v5'],lim:['l1','l3','l5'],sup:['s1'],supOpt:['s4']},\n  logic:'No existe una etiqueta previa de \"tipo de estudiante\": nadie sabe de antemano cuántos grupos hay ni cuáles son. Es la situación típica del \u003cb>agrupamiento no supervisado\u003c/b>: el algoritmo encuentra conjuntos de estudiantes con conductas parecidas y el docente debe interpretar qué significan. Los grupos describen conductas en un momento, no identidades: convertirlos en \"rutas obligatorias\" o en etiquetas fijas contradice la naturaleza del método y reproduce el problema de los estilos de aprendizaje. El valor está en \u003cb>rediseñar el curso\u003c/b> y, si acaso, en formar grupos de trabajo revisables; la interpretación es del \u003cb>docente\u003c/b>, con apoyo del analista.'},\n {k:'3',short:'Dificultades recurrentes',title:'Identificación de dificultades recurrentes',who:'Lo plantea el área de Matemáticas',ctx:'\"Año tras año los estudiantes se traban en lo mismo, pero solo lo sabemos por intuición. Queremos saber qué conceptos fallan de forma sistemática y en qué momento.\"',expect:'El área espera un ranking de temas difíciles por curso.',\n  ref:{datos:['d7','d6','d5','d12'],datosOpt:['d3'],labels:[],tarea:['t5'],tareaOpt:['t3','t6','t7'],enf:['a2'],enfOpt:['a7','a6'],valor:['v2','v4'],lim:['l5','l4'],sup:['s1'],supOpt:['s3']},\n  logic:'La pregunta es sobre \u003cb>patrones\u003c/b> en los errores, no sobre predecir a una persona. Con resultados ítem por ítem (d7) basta a menudo una analítica descriptiva o la detección de patrones recurrentes; con respuestas abiertas (d6) y mensajes del foro (d5), el procesamiento de lenguaje puede agrupar errores conceptuales parecidos sin etiquetas previas. Es un uso \u003cb>no supervisado o descriptivo\u003c/b>, orientado al \u003cb>rediseño de la enseñanza\u003c/b>. El sistema identifica dónde se concentran los fallos; \u003cb>por qué\u003c/b> ocurren lo decide el docente que conoce el contenido y el grupo.'},\n {k:'4',short:'Predicción de rendimiento',title:'Predicción de rendimiento',who:'Lo plantea Registro Académico',ctx:'\"Queremos estimar la nota final de cada estudiante a mitad del curso para avisarle a tiempo y para que los docentes ajusten.\" Algunos docentes temen que la estimación se convierta en la nota.',expect:'Registro espera un número por estudiante en la semana 8.',\n  ref:{datos:['d1','d2','d3','d7','d9'],datosOpt:['d12'],labels:['d3'],tarea:['t2'],tareaOpt:['t1'],enf:['a1'],enfOpt:[],valor:['v4','v1'],lim:['l2','l1','l5'],sup:['s1'],supOpt:['s4']},\n  logic:'Existe el resultado histórico (calificaciones finales: d3), así que un modelo \u003cb>supervisado\u003c/b> puede aprender a estimar la nota a partir de señales de medio curso. Si la salida es un número, es \u003cb>regresión\u003c/b>; si es \"en riesgo de reprobar / no\", es clasificación: ambas son válidas y la elección depende de la decisión que se quiera apoyar. Esa decisión es \u003cb>retroalimentar a tiempo\u003c/b> al estudiante y al docente, nunca \u003cb>fijar la calificación\u003c/b>: la estimación es una hipótesis sobre el pasado de otros, no una evaluación del aprendizaje de esta persona. La interpreta el \u003cb>docente\u003c/b>.'},\n {k:'5',short:'Recomendación de recursos',title:'Recomendación personalizada de recursos',who:'Lo plantea la Biblioteca y el Centro de Recursos',ctx:'\"Tenemos 3 400 recursos etiquetados y casi nadie los usa. Queremos que cada estudiante reciba sugerencias según lo que está estudiando y lo que le cuesta.\"',expect:'La biblioteca espera \"un Netflix de recursos académicos\".',\n  ref:{datos:['d1','d7','d11'],datosOpt:['d2'],labels:[],tarea:['t4'],tareaOpt:[],enf:['a7'],enfOpt:['a1','a2'],valor:['v4','v3'],lim:['l3','l4'],sup:['s5'],supOpt:['s1']},\n  logic:'Un \u003cb>sistema de recomendación\u003c/b> combina dos lógicas: similitud de contenido (las etiquetas del catálogo, d11, frente a lo que el estudiante está estudiando y falla, d7) y filtrado colaborativo (lo que usaron estudiantes parecidos, d1). Por eso suele ser \u003cb>híbrido\u003c/b>, con partes supervisadas y no supervisadas. Con pocas valoraciones, el inicio es frío y las sugerencias deben presentarse como opciones, no como ruta obligatoria. El valor es \u003cb>orientar al estudiante\u003c/b>; la supervisión principal es \u003cb>el propio estudiante\u003c/b>, que acepta o descarta, con el docente curando el catálogo.'},\n {k:'6',short:'Clasificación de respuestas',title:'Clasificación automatizada de respuestas',who:'Lo plantea un equipo docente',ctx:'\"Corregimos 1 800 respuestas abiertas por semestre. Queremos que el sistema las clasifique según la rúbrica para devolver retroalimentación más rápido.\" Hay dos cursos con respuestas ya calificadas.',expect:'El equipo espera que el sistema \"ponga la nota\".',\n  ref:{datos:['d6'],datosOpt:['d7'],labels:['d6'],tarea:['t6'],tareaOpt:['t1'],enf:['a1'],enfOpt:['a5','a7'],valor:['v4','v2'],lim:['l2'],sup:['s1'],supOpt:[]},\n  logic:'Las ≈1 800 respuestas ya calificadas con rúbrica son \u003cb>etiquetas\u003c/b>: permiten entrenar un clasificador \u003cb>supervisado\u003c/b> de texto (procesamiento de lenguaje natural) que asigne cada respuesta nueva a un nivel de la rúbrica. Un modelo generativo puede hacerlo sin entrenamiento, pero con menos control sobre sus criterios. En ambos casos la salida es una \u003cb>sugerencia de nivel\u003c/b> que acelera la retroalimentación; \u003cb>la calificación la asigna el docente\u003c/b>, que además debe revisar las respuestas donde el modelo duda. Automatizar la nota convierte una herramienta de apoyo en un evaluador sin responsabilidad.'},\n {k:'7',short:'Patrones de participación',title:'Detección de patrones de participación',who:'Lo plantea Bienestar Estudiantil',ctx:'\"En los foros hay estudiantes que nunca responden a nadie, otros que concentran la conversación y grupos que solo hablan entre sí. Queremos verlo antes de que termine el curso.\"',expect:'Bienestar espera identificar a \"los aislados\" para intervenir.',\n  ref:{datos:['d5','d1','d9'],datosOpt:[],labels:[],tarea:['t5'],tareaOpt:['t3','t7'],enf:['a2'],enfOpt:['a6','a7'],valor:['v2','v1'],lim:['l1','l4'],sup:['s1'],supOpt:['s2']},\n  logic:'La estructura de la conversación (quién responde a quién, cuánto, cuándo) es un \u003cb>patrón\u003c/b> que se describe con análisis de redes y detección de anomalías o agrupamientos: \u003cb>no supervisado o descriptivo\u003c/b>, sin etiquetas. El resultado es un mapa de la participación, útil para que el \u003cb>docente ajuste la moderación\u003c/b> y, con cuidado, para que Tutoría acompañe. Nombrar públicamente a \"los aislados\" o intervenir sin conocer por qué alguien participa poco —trabajo, conectividad, preferencia— convierte un dato descriptivo en una etiqueta.'}\n];\n\nvar REFS=[\n 'Arnold, K. E., y Pistilli, M. D. (2012). Course Signals at Purdue: Using learning analytics to increase student success. \u003cem>Proceedings of the 2nd International Conference on Learning Analytics and Knowledge\u003c/em>, 267–270. https://doi.org/10.1145/2330601.2330666',\n 'Baker, R. S., y Hawn, A. (2022). Algorithmic bias in education. \u003cem>International Journal of Artificial Intelligence in Education, 32\u003c/em>, 1052–1092. https://doi.org/10.1007/s40593-021-00285-9',\n 'Holmes, W., Bialik, M., y Fadel, C. (2019). \u003cem>Artificial intelligence in education: Promises and implications for teaching and learning.\u003c/em> Center for Curriculum Redesign.',\n 'Jordan, M. I., y Mitchell, T. M. (2015). Machine learning: Trends, perspectives, and prospects. \u003cem>Science, 349\u003c/em>(6245), 255–260. https://doi.org/10.1126/science.aaa8415',\n 'Luckin, R., Holmes, W., Griffiths, M., y Forcier, L. B. (2016). \u003cem>Intelligence unleashed: An argument for AI in education.\u003c/em> Pearson.',\n 'Molenaar, I. (2022). Towards hybrid human-AI learning technologies. \u003cem>European Journal of Education, 57\u003c/em>(4), 632–645. https://doi.org/10.1111/ejed.12527',\n 'Romero, C., y Ventura, S. (2020). Educational data mining and learning analytics: An updated survey. \u003cem>WIREs Data Mining and Knowledge Discovery, 10\u003c/em>(3), e1355. https://doi.org/10.1002/widm.1355',\n 'Selwyn, N. (2019). \u003cem>Should robots replace teachers? AI and the future of education.\u003c/em> Polity.',\n 'Siemens, G. (2013). Learning analytics: The emergence of a discipline. \u003cem>American Behavioral Scientist, 57\u003c/em>(10), 1380–1400. https://doi.org/10.1177/0002764213498851',\n 'Slade, S., y Prinsloo, P. (2013). Learning analytics: Ethical issues and dilemmas. \u003cem>American Behavioral Scientist, 57\u003c/em>(10), 1510–1529. https://doi.org/10.1177/0002764213479366',\n 'UNESCO. (2021). \u003cem>AI and education: Guidance for policy-makers.\u003c/em> UNESCO.'\n];\n\n/* ================= STATE ================= */\nvar S;\nfunction freshCase(){ return {problema:'',datos:[],tarea:null,enfoque:null,valor:[],lim:[],sup:null,just:''}; }\nfunction freshState(){ return {phase:0,cases:CASES.map(freshCase),transfer:{needs:null,t_ctx:'',t_sit:'',t_why:'',tarea:null,enfoque:null,sup:null,p1:'',p2:'',p5:'',p6:''},refl:{nombre:'',programa:''}}; }\nfunction load(){ S=freshState(); try{ var raw=window.localStorage.getItem(STORE_KEY); if(raw){ var o=JSON.parse(raw); if(o&&o.cases&&o.cases.length===7){ S.phase=o.phase||0; o.cases.forEach(function(c,i){ Object.keys(S.cases[i]).forEach(function(k){ if(c[k]!==undefined) S.cases[i][k]=c[k]; }); }); Object.keys(S.transfer).forEach(function(k){ if(o.transfer&&o.transfer[k]!==undefined) S.transfer[k]=o.transfer[k]; }); Object.keys(S.refl).forEach(function(k){ if(o.refl&&o.refl[k]!==undefined) S.refl[k]=o.refl[k]; }); } } }catch(e){} }\nfunction save(){ try{ window.localStorage.setItem(STORE_KEY,JSON.stringify(S)); }catch(e){} }\n\n/* ================= HELPERS ================= */\nfunction esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;'); }\nfunction dimHTML(s){ return esc(s).replace(/\\[u\\]/g,'\u003cspan class=\"u\">').replace(/\\[\\/u\\]/g,'\u003c/span>'); }\nfunction $(sel,ctx){ return (ctx||document).querySelector(sel); }\nfunction $$(sel,ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(sel)); }\nfunction toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('show'); },2400); }\nfunction seg(kind,id,field,dict,cur){ var h='\u003cdiv class=\"seg\" data-kind=\"'+kind+'\" data-id=\"'+id+'\" data-field=\"'+field+'\">'; Object.keys(dict).forEach(function(o){ h+='\u003cbutton type=\"button\" data-v=\"'+o+'\" class=\"'+(cur===o?'on':'')+'\">'+esc(dict[o])+'\u003c/button>'; }); return h+'\u003c/div>'; }\nfunction chips(kind,id,field,dict,cur,riskSet,badSet){ var h='\u003cdiv class=\"tag-group\">'; Object.keys(dict).forEach(function(o){ var on=cur.indexOf(o)>=0; h+='\u003cbutton type=\"button\" class=\"chip pick'+(on?' on':'')+'\" data-kind=\"'+kind+'\" data-id=\"'+id+'\" data-field=\"'+field+'\" data-v=\"'+o+'\"'+(riskSet&&riskSet.indexOf(o)>=0?' data-risk=\"1\"':'')+(badSet&&badSet.indexOf(o)>=0?' data-bad=\"1\"':'')+'>'+esc(dict[o])+'\u003c/button>'; }); return h+'\u003c/div>'; }\nfunction names(dict,arr){ return (arr||[]).map(function(k){ return dict[k]; }).filter(Boolean); }\nfunction dataName(k){ var d=DATA.filter(function(x){return x.id===k;})[0]; return d?d.nm:k; }\n\n/* ================= RENDER: ESCENARIO ================= */\nfunction renderInventory(){ $('#inventory').innerHTML=DATA.map(function(d){ return '\u003cdiv class=\"inv'+(d.sens?' sens':'')+'\">\u003cspan class=\"id\">'+d.id.toUpperCase()+'\u003c/span>\u003cdiv>\u003cdiv class=\"nm\">'+esc(d.nm)+'\u003c/div>\u003cdiv class=\"nt\">'+dimHTML(d.nt)+'\u003c/div>\u003c/div>\u003c/div>'; }).join(''); }\nfunction renderCaseCards(){ $('#caseCards').innerHTML=CASES.map(function(c,i){ return '\u003cdiv class=\"card case-card\">\u003cdiv class=\"label\">Caso '+c.k+' · '+esc(c.who)+'\u003c/div>\u003ch3>'+esc(c.title)+'\u003c/h3>\u003cp>'+esc(c.ctx)+'\u003c/p>\u003cp style=\"margin-top:8px;\">\u003cspan class=\"faint\">Expectativa del área:\u003c/span> '+esc(c.expect)+'\u003c/p>\u003c/div>'; }).join(''); }\n\n/* ================= RENDER: LAB ================= */\nfunction caseDone(c){ return c.problema.trim()&&c.datos.length&&c.tarea&&c.enfoque&&c.valor.length&&c.lim.length&&c.sup; }\nfunction renderStepper(){ $('#stepper').innerHTML=CASES.map(function(c,i){ return '\u003cbutton type=\"button\" class=\"step'+(S.phase===i?' active':'')+(caseDone(S.cases[i])?' done':'')+'\" data-phase=\"'+i+'\">\u003cspan class=\"num\">'+c.k+'\u003c/span>'+esc(c.short)+'\u003c/button>'; }).join(''); }\nfunction renderLab(){ renderStepper(); var i=S.phase,c=CASES[i],st=S.cases[i];\n var h='\u003cdiv class=\"phase-arrow\">Caso '+c.k+' de 7 · \u003cb>'+esc(c.title)+'\u003c/b>\u003c/div>';\n h+='\u003cdiv class=\"card\" style=\"margin-bottom:14px;\">\u003cdiv class=\"case-head\">\u003cdiv class=\"k\">'+c.k+'\u003c/div>\u003cdiv>\u003cdiv class=\"who\">'+esc(c.who)+'\u003c/div>\u003cp class=\"ctx\">'+esc(c.ctx)+'\u003c/p>\u003cp class=\"ctx\" style=\"margin-top:6px;\">\u003cspan class=\"faint\">Expectativa del área:\u003c/span> '+esc(c.expect)+'\u003c/p>\u003c/div>\u003c/div>\u003c/div>';\n h+='\u003cdiv class=\"card\">\u003cdiv class=\"label\">Análisis de siete elementos\u003c/div>';\n h+=elem('01','Problema educativo','¿Qué situación requiere atención? Formúlala en términos de aprendizaje, permanencia o experiencia, y di a qué nivel de decisión afecta.','\u003ctextarea data-case=\"'+i+'\" data-field=\"problema\" placeholder=\"Ej.: Un grupo de estudiantes deja de participar entre las semanas 3 y 5 sin que Tutoría lo sepa a tiempo; la decisión afectada es a quién contactar y cuándo.\">'+esc(st.problema)+'\u003c/textarea>');\n h+=elem('02','Tipo de datos disponibles','¿Qué información del inventario podría utilizarse? Marca solo la pertinente. Los datos sensibles exigen justificación.',chips('case',i,'datos',DATA.reduce(function(o,d){o[d.id]=d.nm;return o;},{}),st.datos,['d8','d10'],null));\n h+=elem('03','Tipo de tarea','Clasificación, regresión, agrupamiento u otra. Recuerda que predecir es un propósito, no una tarea.',seg('case',i,'tarea',TASKS,st.tarea));\n h+=elem('04','Posible enfoque de IA','Supervisado, no supervisado u otro. Si eliges supervisado, verifica que entre tus datos haya ejemplos con resultado conocido.',seg('case',i,'enfoque',APPR,st.enfoque));\n h+=elem('05','Valor pedagógico','¿Qué decisión podría apoyar? Marca las que correspondan.',chips('case',i,'valor',VALS,st.valor,null,['v6','v7']));\n h+=elem('06','Limitación','¿Qué no debería decidir automáticamente el sistema? Marca las que correspondan.',chips('case',i,'lim',LIMS,st.lim,null,['l6']));\n h+=elem('07','Supervisión humana','¿Quién debe interpretar o validar el resultado antes de que tenga consecuencias?',seg('case',i,'sup',SUPS,st.sup));\n h+=elem('','Justificación breve','Por qué este enfoque y no otro; qué condición de datos o de supervisión lo hace viable.','\u003ctextarea data-case=\"'+i+'\" data-field=\"just\" placeholder=\"Dos a cinco líneas.\">'+esc(st.just)+'\u003c/textarea>');\n h+='\u003c/div>';\n h+='\u003cdiv class=\"nav-row\">'+(i>0?'\u003cbutton class=\"pill-btn gophase\" data-gophase=\"'+(i-1)+'\">← Caso '+CASES[i-1].k+'\u003c/button>':'\u003cbutton class=\"pill-btn goto\" data-goto=\"2\">← Escenario\u003c/button>')+(i\u003c6?'\u003cbutton class=\"pill-btn primary gophase\" data-gophase=\"'+(i+1)+'\">Caso '+CASES[i+1].k+' →\u003c/button>':'\u003cbutton class=\"pill-btn primary goto\" data-goto=\"4\">Ver la lectura de referencia →\u003c/button>')+'\u003c/div>';\n $('#labBody').innerHTML=h; }\nfunction elem(n,t,q,body){ return '\u003cdiv class=\"elem\">\u003cdiv>'+(n?'\u003cdiv class=\"en\">Elemento '+n+'\u003c/div>':'')+'\u003cdiv class=\"et\">'+esc(t)+'\u003c/div>\u003cdiv class=\"eq\">'+esc(q)+'\u003c/div>\u003c/div>\u003cdiv>'+body+'\u003c/div>\u003c/div>'; }\n\n/* ================= EVALUATE ================= */\nfunction overlap(sel,ref,opt,badPenalty){ if(!ref.length) return sel.length?1:0; va
