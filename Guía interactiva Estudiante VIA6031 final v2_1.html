le('on',b.getAttribute('data-v')===String(getPath(path))); }); if(/\\.score$/.test(path)){ var box=sg.closest('.tool'),lv=box.querySelector('.lv'),m=path.match(/^cells\\.(\\w+)\\./),c=CRIT.filter(function(x){return x.id===m[1];})[0],sc=getPath(path); var html=sc?'\u003cdiv class=\"lv\">\u003cb>Nivel '+sc+':\u003c/b> '+esc(c.lv[sc-1])+'\u003c/div>':''; if(lv) lv.outerHTML=html; else sg.closest('.row2').insertAdjacentHTML('afterend',html); } if(path==='rec.choice') $('#recDraft').innerHTML=draft(); renderStepper(); markTabs(); return; }\n});\ndocument.addEventListener('change',function(ev){ var el=ev.target; if(el.tagName==='SELECT'&&el.hasAttribute('data-path')){ setPath(el.getAttribute('data-path'),el.value); save(); } });\ndocument.addEventListener('input',function(ev){ var el=ev.target; if(el.hasAttribute('data-path')&&el.tagName!=='SELECT'){ setPath(el.getAttribute('data-path'),el.value); save(); clearTimeout(document._st); document._st=setTimeout(function(){ renderStepper(); markTabs(); if($('.panel[data-panel=\"5\"]').classList.contains('active')) renderChecklist(); },350); return; } if(el.hasAttribute('data-ref')){ S.refl[el.getAttribute('data-ref')]=el.value; save(); markTabs(); clearTimeout(document._sf); document._sf=setTimeout(renderChecklist,400); } });\n\nload(); renderAll();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}</script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let done = lsGet('via6031:done', {});
let wsData = lsGet('via6031:ws', {});
let grades = lsGet('via6031:grades', {});
const W = DATA.weeks;
const weekClos = w => [...new Set(w.slo.flatMap(s => s[2] || []))].sort();
const hasSum = w => w.acts.some(a => a.peso > 0);
const hasLab = w => w.acts.some(a => a.lab);
let LABS = null;
const labHtml = id => { if (!LABS) { try { LABS = JSON.parse(document.getElementById('labs-json').textContent); } catch (e) { LABS = {}; } } return LABS[id] || ''; };
const checksFor = w => [
  'Leer las lecturas de la semana y la pregunta esencial',
  w.acts.some(a => a.rid) ? 'Revisar la rúbrica de la actividad en Recursos' : 'Revisar las instrucciones de la actividad en Blackboard',
  hasLab(w) ? 'Completar las actividades de la semana, incluido el simulador y la descarga de tu informe o ficha' : 'Completar las actividades de la semana',
  w.n === 5 ? 'Cargar el certificado SUJIS en Blackboard' : hasSum(w) ? 'Entregar en Blackboard antes del cierre' : 'Guardar la evidencia para tu producto integrador'
];
const weekDone = w => checksFor(w).every((_, i) => done[w.n + '-' + i]);
const letter = p => p >= 94 ? 'A' : p >= 90 ? 'A–' : p >= 87 ? 'B+' : p >= 84 ? 'B' : p >= 80 ? 'B–' : p >= 77 ? 'C+' : p >= 74 ? 'C' : 'F';
const fmt = n => n.toLocaleString('es', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const wkPeso = w => w.acts.reduce((a, x) => a + x.peso, 0);

function parseHash() {
  const h = (location.hash || '').replace('#', '');
  if (h === 'recursos' || h === 'producto') return { v: h };
  const m = h.match(/^semana-(\d+)$/);
  if (m && +m[1] >= 1 && +m[1] <= 10) return { v: 'semana', n: +m[1] };
  return { v: 'inicio' };
}
function go(t) { if (location.hash === '#' + t) route(); else location.hash = t; }
window.addEventListener('hashchange', route);

function renderSteps(cur) {
  $('#steps').innerHTML = W.map(w => {
    const cls = [weekDone(w) ? 'done' : '', cur === w.n ? 'now' : '', w.acts.some(a => a.rid || a.peso) ? 'eval' : ''].join(' ');
    return `<li class="${cls}"><button type="button" data-w="${w.n}" aria-label="Semana ${w.n}: ${esc(w.short)}"${cur === w.n ? ' aria-current="step"' : ''}><span class="dot">${weekDone(w) ? '✓' : w.n}</span><span>${esc(w.short)}</span></button></li>`;
  }).join('');
  const total = W.filter(weekDone).length;
  $('#progress-label').textContent = cur ? `Semana ${cur} de 10 · Avance ${total}` : `Avance ${total} de 10`;
}

function viewInicio() {
  const chain = W.map(w => { const s = wkPeso(w); return `<button type="button" data-go="semana-${w.n}"><span class="n">SEMANA ${w.n}</span><span class="t">${esc(w.short)}</span><span class="p ${s ? '' : 'f'}">${s ? s + '%' : 'Formativa'}</span>${hasLab(w) ? '<span class="n">+ Simulador interactivo</span>' : ''}</button>`; }).join('');
  return `
  <div class="hero">
    <div class="eyebrow">Master of Science in Virtual Education · Concentración en IA</div>
    <h1>Introducción a la Inteligencia Artificial en Educación</h1>
    <p class="lead">El curso parte de cómo aprenden las personas y de qué problema educativo hay que resolver. Solo después pregunta si la IA aporta valor, bajo qué condiciones y con qué supervisión humana.</p>
    <div class="chips"><span class="chip">10 semanas</span><span class="chip">3 créditos · 48 horas</span><span class="chip">En línea</span><span class="chip">Sin prerrequisitos</span><span class="chip">8 evidencias sumativas = 100%</span><span class="chip">4 simuladores interactivos</span></div>
  </div>
  <section class="callout"><b>Enfoque.</b> Priorizas comprender, analizar, evaluar y recomendar. No se evalúa tu capacidad de programar. Cada semana construye una pieza de la Propuesta de Integración Educativa de IA que defiendes en la semana 10.</section>
  <section class="card"><div class="sec-title"><div class="eyebrow">Cadena de evaluación</div><h2>Qué se entrega y cuánto pesa cada semana</h2></div>
    <div class="bar" role="img" aria-label="Distribución del peso por semana">${W.map(w => wkPeso(w) ? `<i style="width:${wkPeso(w)}%"></i>` : '').join('')}</div>
    <p class="foot" style="margin:8px 0 14px">Las semanas con porcentaje suman 100%. Las formativas no tienen nota y alimentan las sumativas.</p>
    <div class="chain">${chain}</div></section>
  <section class="card"><div class="sec-title"><div class="eyebrow">Simuladores interactivos</div><h2>Cuatro laboratorios para practicar antes de entregar</h2></div>
    <p class="foot" style="margin-bottom:12px">Son actividades formativas, sin nota. Cada uno termina en un informe o ficha descargable que te sirve de insumo para tu producto integrador.</p>
    <div class="lab-list">${Object.entries(DATA.labs).map(([k, L]) => `<button type="button" class="row" data-labgo="${k}"><span class="n">SEMANA ${L.sem} · ${esc(L.dur)}</span><b>${esc(L.title)}</b></button>`).join('')}</div></section>
  <section class="card"><div class="sec-title"><div class="eyebrow">Resultados de aprendizaje del curso</div><h2>Al finalizar podrás</h2></div>
    <ul class="slo">${DATA.clos.map(c => `<li><code>${c[0]}</code><span>${esc(c[1])}</span></li>`).join('')}</ul></section>
  <div class="grid2">
    <section class="card"><div class="sec-title"><div class="eyebrow">Docente y acompañamiento</div><h2>Dr. Arsenio Pérez</h2></div>
      <p>Correo BIU: <span class="mono" id="mail">aperez@professor.biu.us</span> <button class="copy" type="button" data-copy="aperez@professor.biu.us">Copiar</button></p>
      <ul style="margin:10px 0 0;padding-left:20px;display:grid;gap:4px"><li>Chats de consulta: martes y jueves, 6:00 a 8:00 p. m.</li><li>Videoconferencias: sábados, 8:30 a 10:00 a. m.</li></ul>
      <p class="foot" style="margin-top:8px">Horario de Miami. Los enlaces y cualquier ajuste se publican en Blackboard, que es la fuente oficial de fechas.</p></section>
    <section class="card"><div class="sec-title"><div class="eyebrow">Ritmo semanal</div><h2>Un lunes, un anuncio</h2></div>
      <p>Cada lunes por la mañana se publica el mensaje de la semana con la pregunta esencial, las actividades y los puntos de atención. Esta guía repite lo que dice el Syllabus y te deja marcar tu avance y trabajar tus matrices en el navegador.</p></section>
  </div>
  <section class="card"><div class="sec-title"><div class="eyebrow">Primeros pasos</div><h2>Antes de la semana 1</h2></div>
    <ul class="check" style="margin:0">${['Leer el Syllabus vigente y las cuatro metas del curso','Recorrer el módulo de la semana 1 y revisar la rúbrica del foro (R1)','Presentarte ante el grupo y entrar al foro de reflexión','Elegir una necesidad educativa de tu contexto que te acompañe todo el curso'].map((c, i) => `<li><label><input type="checkbox" data-k="start-${i}"${done['start-' + i] ? ' checked' : ''}><span>${esc(c)}</span></label></li>`).join('')}</ul></section>
  <section class="card" style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center"><div><h3>Empezar</h3><p class="foot">Si es tu primera vez aquí, comienza por la semana 1.</p></div><div class="chips"><button class="chip accent" type="button" data-go="semana-1">Ir a la semana 1</button><button class="chip" type="button" data-go="producto">Ver el producto integrador</button><button class="chip" type="button" data-go="recursos">Rúbricas y calculadora</button></div></section>`;
}

function wsHTML(id) {
  const d = DATA.ws[id]; if (!d) return '';
  const v = wsData[id] || {};
  const ta = (k, label, hint) => `<div class="f"><label for="ws-${id}-${k}">${esc(label)}${hint ? ` <small>· ${esc(hint)}</small>` : ''}</label><textarea id="ws-${id}-${k}" data-ws="${id}" data-k="${k}">${esc(v[k] || '')}</textarea></div>`;
  let body = '';
  if (d.type === 'fields' || d.type === 'mixed') {
    if (d.grid) body += `<div class="f"><label>Matriz de riesgos</label></div><div class="grid">${Array.from({ length: d.grid.rows }, (_, r) => `<div class="gr">${d.grid.cols.map((c, ci) => `<div class="f"><label for="ws-${id}-g${r}-${ci}"><small>${esc(c)}</small></label><input type="text" id="ws-${id}-g${r}-${ci}" data-ws="${id}" data-k="g${r}-${ci}" value="${esc(v['g' + r + '-' + ci] || '')}"></div>`).join('')}</div>`).join('')}</div><div class="f"><label>Declaración de Uso Responsable de IA</label></div>`;
    body += d.f.map((f, i) => ta('f' + i, f[0], f[1])).join('');
  } else if (d.type === 'compare') {
    body = d.f.map((c, i) => `<div class="f"><label>${esc(c)}</label><div class="two"><div><span>${esc(d.a)}</span><textarea id="ws-${id}-a${i}" aria-label="${esc(c)}, ${esc(d.a)}" data-ws="${id}" data-k="a${i}">${esc(v['a' + i] || '')}</textarea></div><div><span>${esc(d.b)}</span><textarea id="ws-${id}-b${i}" aria-label="${esc(c)}, ${esc(d.b)}" data-ws="${id}" data-k="b${i}">${esc(v['b' + i] || '')}</textarea></div></div></div>`).join('');
  }
  return `<details class="sec"><summary><span>Hoja de trabajo: ${esc(d.title)}</span><span class="badge f">Borrador privado</span></summary><div class="body ws">
    <p class="foot">Lo que escribas se guarda solo en este navegador. No lo envía a nadie ni reemplaza la entrega en Blackboard. No escribas datos personales de estudiantes.</p>${body}
    <div class="actions"><button class="copy" type="button" data-wscopy="${id}">Copiar como texto</button><button class="copy" type="button" data-wsclear="${id}" data-armed="0">Borrar mis respuestas</button><span class="foot" id="wsmsg-${id}" role="status"></span></div>
    <textarea id="wsfallback-${id}" hidden readonly aria-label="Texto para copiar"></textarea></div></details>`;
}
function wsText(id) {
  const d = DATA.ws[id], v = wsData[id] || {}; let t = d.title.toUpperCase() + '\n\n';
  if (d.type === 'compare') d.f.forEach((c, i) => { t += `${c}\n  ${d.a}: ${v['a' + i] || ''}\n  ${d.b}: ${v['b' + i] || ''}\n`; });
  else {
    if (d.grid) for (let r = 0; r < d.grid.rows; r++) { const row = d.grid.cols.map((c, ci) => v['g' + r + '-' + ci] ? `${c}: ${v['g' + r + '-' + ci]}` : '').filter(Boolean); if (row.length) t += `Riesgo ${r + 1}: ${row.join(' | ')}\n`; }
    d.f.forEach((f, i) => { t += `${f[0]}: ${v['f' + i] || ''}\n`; });
  }
  return t;
}

function labPanel(id) {
  const L = DATA.labs[id]; if (!L) return '';
  return `<div class="lab" id="lab-${id}" data-lab="${id}">
    <div class="lab-top"><div><div class="eyebrow">Simulador interactivo</div><h4>${esc(L.title)}</h4></div><div class="chips"><span class="badge f">${esc(L.dur)}</span></div></div>
    <p>${esc(L.desc)}</p>
    <ul>${L.pts.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    <p class="foot">${esc(L.out)} Tu avance se guarda solo en este navegador. Descarga el informe antes de cambiar de equipo o borrar los datos del navegador.</p>
    <div class="lab-bar"><button class="btn" type="button" data-labopen="${id}">Abrir el simulador aquí</button><button class="copy" type="button" data-labfull="${id}">Pantalla completa</button><button class="copy" type="button" data-labtab="${id}">Abrir en pestaña nueva</button><span class="lab-msg" id="labmsg-${id}" role="status"></span></div>
    <div class="lab-stage" id="labstage-${id}"></div>
  </div>`;
}
function labToggle(id, want) {
  const st = document.getElementById('labstage-' + id), btn = document.querySelector(`[data-labopen="${id}"]`); if (!st) return;
  const isOpen = !!st.firstChild;
  if (want === undefined) want = !isOpen;
  if (want && !isOpen) {
    const f = document.createElement('iframe'); f.className = 'lab-frame'; f.title = DATA.labs[id].title; f.setAttribute('loading', 'lazy'); f.srcdoc = labHtml(id); st.appendChild(f);
    if (btn) btn.textContent = 'Cerrar el simulador';
  } else if (!want && isOpen) { st.innerHTML = ''; if (btn) btn.textContent = 'Abrir el simulador aquí'; }
}
function labFull(id, on) {
  const box = document.getElementById('lab-' + id); if (!box) return;
  if (on === undefined) on = !box.classList.contains('full');
  if (on) labToggle(id, true);
  box.classList.toggle('full', on);
  document.body.style.overflow = on ? 'hidden' : '';
  const b = box.querySelector('[data-labfull]'); if (b) b.textContent = on ? 'Salir de pantalla completa' : 'Pantalla completa';
}
function labTab(id) {
  const m = document.getElementById('labmsg-' + id);
  try {
    const url = URL.createObjectURL(new Blob([labHtml(id)], { type: 'text/html;charset=utf-8' }));
    const w = window.open(url, '_blank');
    m.textContent = w ? '' : 'Tu navegador bloqueó la pestaña nueva. Usa "Abrir el simulador aquí".';
  } catch (e) { m.textContent = 'No se pudo abrir en pestaña nueva. Usa "Abrir el simulador aquí".'; }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const f = document.querySelector('.lab.full'); if (f) labFull(f.dataset.lab, false); } });

function viewSemana(n) {
  const w = W[n - 1], prev = W[n - 2], next = W[n];
  const clos = weekClos(w);
  const acts = w.acts.map(a => `
    <article class="card act">
      <header><h3>${esc(a.name)}</h3><div class="chips"><span class="badge ${a.peso ? '' : 'f'}">${a.tipo} · ${a.peso}%</span><span class="badge f">Individual</span></div></header>
      <ul>${a.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
      ${a.rid ? `<p><button class="link-btn" type="button" data-rub="${a.rid}">Ver rúbrica ${a.rid}</button></p>` : a.peso ? '<p class="foot">La evidencia es el certificado emitido por SUJIS.</p>' : '<p class="foot">Actividad formativa: no suma puntaje y prepara las evaluaciones posteriores.</p>'}
      ${a.lab ? labPanel(a.lab) : ''}
      ${a.prod ? `<p><button class="link-btn" type="button" data-go="producto">Ver las diez secciones del producto final</button></p>` : ''}

  const lec = w.lect;
  return `
  <div class="crumbs"><button type="button" data-go="inicio">Inicio</button> / Semana ${n}</div>
  <div class="week-head">
    <div class="eyebrow">Semana ${n} de 10 · ${esc(w.short)}</div>
    <h1>${esc(w.title)}</h1>
    <p class="lead">${esc(w.desc)}</p>
    <div class="chips">${clos.length ? clos.map(c => `<span class="chip accent">${c}</span>`).join('') : '<span class="chip">Alineación semanal no documentada en el Syllabus</span>'}</div>
  </div>
  <section class="callout"><b>Pregunta esencial.</b> ${esc(w.pregunta)}</section>
  <section class="card"><div class="sec-title"><div class="eyebrow">Resultados de aprendizaje de la semana (SLO)</div><h2>Al terminar podrás</h2></div>
    <ul class="slo">${w.slo.map(s => `<li><code>SLO ${s[0]}</code><span>${esc(s[1])}${s[2] ? `<span class="tags">${s[2].join(', ')} · ${s[3].join(', ')}</span>` : ''}</span></li>`).join('')}</ul></section>
  <section style="display:grid;gap:14px"><div class="sec-title" style="margin:0"><div class="eyebrow">Actividades y evaluación</div><h2>Lo que haces esta semana</h2></div>${acts}</section>
  <section class="card"><div class="sec-title"><div class="eyebrow">Tu lista de la semana</div><h2>Marca tu avance</h2></div>
    <ul class="check" style="margin:0">${checksFor(w).map((c, i) => `<li><label><input type="checkbox" data-k="${n}-${i}"${done[n + '-' + i] ? ' checked' : ''}><span>${esc(c)}</span></label></li>`).join('')}</ul>
    <p class="foot" style="margin-top:10px">Tu avance se guarda solo en este navegador.</p></section>
  <section class="card read"><div class="sec-title"><div class="eyebrow">Lecturas del Syllabus</div><h2>Qué leer</h2></div>
    ${lec.req.length || lec.comp.length ? `<div class="grid2">${lec.req.length ? `<div><h3>Principales</h3><ul>${lec.req.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}${lec.comp.length ? `<div><h3>Complementarias</h3><ul>${lec.comp.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}</div>` : '<p>Sin lecturas nuevas.</p>'}</section>
  ${w.nota ? `<div class="warnbox">${esc(w.nota)}</div>` : ''}
  <div class="warnbox">Uso de IA: según el Syllabus, la IA se usa solo cuando el docente lo autoriza, con verificación, evaluación crítica y reconocimiento de su uso. El anuncio del lunes indica qué está autorizado en cada actividad.</div>
  <nav class="pager" aria-label="Semanas">
    ${prev ? `<button type="button" data-go="semana-${prev.n}"><small>← SEMANA ${prev.n}</small><span>${esc(prev.short)}</span></button>` : '<span class="ph"></span>'}
    ${next ? `<button type="button" data-go="semana-${next.n}"><small>SEMANA ${next.n} →</small><span>${esc(next.short)}</span></button>` : `<button type="button" data-go="recursos"><small>FINAL →</small><span>Recursos y rúbricas</span></button>`}
  </nav>`;
}

function viewProducto() {
  const secs = DATA.prod.map((s, i) => `<details><summary><span>${i + 1}. ${esc(s[0])}</span><span class="src">${s[1].map(n => `<button class="chip accent" type="button" data-go="semana-${n}">Sem. ${n}</button>`).join('')}</span></summary><div class="body"><ul>${s[2].map(x => `<li>${esc(x)}</li>`).join('')}</ul></div></details>`).join('');
  return `
  <div class="crumbs"><button type="button" data-go="inicio">Inicio</button> / Producto integrador</div>
  <div class="week-head"><div class="eyebrow">Hilo conductor del curso</div><h1>Propuesta de Integración Educativa de IA</h1>
    <p class="lead">Un solo problema educativo te acompaña de la semana 1 a la 10. Los avances parciales se convierten en las secciones del documento final (20%) que luego defiendes en 10 a 12 minutos (10%).</p></div>
  <section class="callout"><b>Qué cambia semana a semana.</b> Semana 1: identificas el problema. Semana 2: lo diagnosticas. Semana 3: lo enmarcas con datos. Semana 4: comparas alternativas. Semana 6 y 7: evalúas y eliges herramienta. Semana 8: revisas accesibilidad. Semana 9: analizas ética y riesgos. Semana 10: integras y defiendes.</section>
  <section class="card"><div class="sec-title"><div class="eyebrow">Estructura del producto final</div><h2>Diez secciones y de dónde sale cada una</h2></div>
    <div class="pmap">${secs}</div>
    <p class="foot" style="margin-top:12px">Los contenidos de cada sección están en el Syllabus (semana 10, Parte A). La relación con las semanas es una guía derivada de lo que el Syllabus dice que se integra: el diagnóstico de la semana 2 es la primera sección formal, el informe de la semana 7 se integra como sección y el análisis ético de la semana 9 pasa directo al proyecto final. Confírmala con tu docente.</p></section>
  <section class="warnbox">Alcance: no desarrollas un sistema de IA ni una experiencia instruccional completa. Eso corresponde a cursos posteriores de la concentración. Demuestras que puedes comprender, analizar, evaluar y recomendar. En la defensa debes poder modificar tu posición cuando la evidencia lo justifique.</section>
  <div class="grid2">
    <button class="card" type="button" data-rub="R6" style="text-align:left"><div class="eyebrow">Rúbrica R6</div><h3 style="margin-top:6px">Propuesta escrita · 20%</h3></button>
    <button class="card" type="button" data-rub="R7" style="text-align:left"><div class="eyebrow">Rúbrica R7</div><h3 style="margin-top:6px">Presentación y defensa · 10%</h3></button>
  </div>`;
}

function rubricTable(r) {
  return `<div class="tablewrap"><table><thead><tr><th>Criterio</th><th>Excelente 94–100%</th><th>Competente 80–93%</th><th>En desarrollo 74–79%</th><th>Insuficiente ≤73%</th></tr></thead><tbody>${r.crit.map(k => `<tr><td><b>${esc(k[0])}</b></td><td>${esc(k[1])}</td><td>${esc(k[2])}</td><td>${esc(k[3])}</td><td>${esc(k[4])}</td></tr>`).join('')}</tbody></table></div>`;
}
let cloFilter = 'CLO1';
function alignHTML() {
  const rows = W.flatMap(w => w.slo.filter(s => s[2] && s[2].includes(cloFilter)).map(s => `<tr><td class="num"><button class="link-btn" type="button" data-go="semana-${w.n}">Sem. ${w.n}</button></td><td class="mono">SLO ${s[0]}</td><td>${esc(s[1])}</td></tr>`)).join('');
  return `<div class="filter" role="group" aria-label="Filtrar por CLO">${DATA.clos.map(c => `<button type="button" data-clo="${c[0]}" aria-pressed="${c[0] === cloFilter}">${c[0]}</button>`).join('')}</div>
  <p class="callout" style="margin-top:12px">${esc(DATA.clos.find(c => c[0] === cloFilter)[1])}</p>
  <div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Semana</th><th>SLO</th><th>Resultado de la semana</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="foot" style="margin-top:8px">La semana 5 no tiene alineación SLO–CLO documentada en el Syllabus.</p>`;
}
function viewRecursos() {
  const plan = DATA.plan.map(p => `<tr><td class="num">${p[0]}</td><td>${esc(p[1])}</td><td>${p[2]}</td><td class="num">${p[3]}%</td></tr>`).join('');
  const scale = [['94 a 100', 'A'], ['90 a 93', 'A–'], ['87 a 89', 'B+'], ['84 a 86', 'B'], ['80 a 83', 'B–'], ['77 a 79', 'C+'], ['74 a 76', 'C'], ['73 o menos', 'F']].map(s => `<tr><td>${s[0]}</td><td>${s[1]}</td></tr>`).join('');
  const graded = DATA.plan.filter(p => p[3] > 0);
  const calcRows = graded.map((p, i) => `<div class="row"><label for="c-${i}">Sem. ${p[0]} · ${esc(p[1])}</label><input type="number" id="c-${i}" min="0" max="100" step="0.1" inputmode="decimal" placeholder="0 a 100" data-i="${i}" value="${grades[i] ?? ''}"><span class="w">${p[3]}% del curso</span></div>`).join('');
  return `
  <div class="crumbs"><button type="button" data-go="inicio">Inicio</button> / Recursos</div>
  <div class="week-head"><div class="eyebrow">Recursos del curso</div><h1>Plan de evaluación, escala BIU y rúbricas</h1>
    <p class="lead">Lo que no cambia de una semana a otra: el desglose del 100%, la escala de calificación, las políticas y las rúbricas analíticas de las siete evaluaciones con rúbrica.</p>
    <div class="tabs"><a href="#plan" data-anchor="plan">Plan</a><a href="#escala" data-anchor="escala">Escala</a><a href="#calculadora" data-anchor="calculadora">Calculadora</a><a href="#alineacion" data-anchor="alineacion">Alineación CLO</a><a href="#politicas" data-anchor="politicas">Políticas</a><a href="#simuladores" data-anchor="simuladores">Simuladores</a><a href="#rubricas" data-anchor="rubricas">Rúbricas</a><a href="#lecturas" data-anchor="lecturas">Lecturas</a></div></div>
  <section class="card" id="plan"><div class="sec-title"><div class="eyebrow">Plan de evaluación</div><h2>Desglose del 100%</h2></div>
    <div class="tablewrap"><table><thead><tr><th class="num">Sem.</th><th>Actividad</th><th>Tipo</th><th class="num">Valor</th></tr></thead><tbody>${plan}<tr class="total"><td></td><td>Total</td><td></td><td class="num">100%</td></tr></tbody></table></div></section>
  <div class="grid2">
    <section class="card" id="escala"><div class="sec-title"><div class="eyebrow">Escala de posgrado BIU</div><h2>Puntaje y nota</h2></div>
      <div class="tablewrap"><table><thead><tr><th>Porcentaje</th><th>Nota</th></tr></thead><tbody>${scale}</tbody></table></div>
      <p class="foot" style="margin-top:8px">Niveles de las rúbricas: Excelente (A, 94–100), Competente (A–, B+, B, B–: 80–93), En desarrollo (C+, C: 74–79), Insuficiente (F, 73 o menos).</p></section>
    <section class="card" id="politicas"><div class="sec-title"><div class="eyebrow">Políticas del Syllabus</div><h2>Lo esencial</h2></div>
      <ul style="margin:0;padding-left:20px;display:grid;gap:8px"><li><b>Entregas.</b> En las fechas publicadas en Blackboard y con participación activa cada semana.</li><li><b>Integridad.</b> Trabajo original. El plagio, la fabricación y el uso no autorizado de IA pueden llevar a medidas disciplinarias.</li><li><b>IA.</b> Solo cuando el docente la autorice. Verifica, evalúa críticamente y reconoce su uso.</li><li><b>Citas.</b> Formato APA 7.ª edición cuando aplique.</li><li><b>Accesibilidad.</b> El curso aplica Diseño Universal para el Aprendizaje (UDL). Si necesitas adaptaciones, contacta a la oficina de BIU lo antes posible.</li></ul></section>
  </div>
  <section class="card calc" id="calculadora"><div class="sec-title"><div class="eyebrow">Calculadora</div><h2>Tu nota hasta ahora</h2></div>
    <p class="foot">Escribe la nota (0 a 100) de cada evidencia que ya recibiste. Las vacías cuentan como pendientes. Se guarda en este navegador.</p>
    <div class="rows">${calcRows}</div>
    <div class="result" aria-live="polite"><div><small>Puntos acumulados</small><b id="r-pts">0,0</b></div><div><small>Promedio de lo calificado</small><b id="r-avg">–</b></div><div><small>Nota provisional</small><b id="r-let">–</b></div><div><small>Para cerrar en A (94)</small><b id="r-need">–</b></div></div></section>
  <section class="card" id="alineacion"><div class="sec-title"><div class="eyebrow">Explorador de alineación</div><h2>Dónde se trabaja cada CLO</h2></div><div id="align">${alignHTML()}</div></section>
  <section class="card" id="simuladores"><div class="sec-title"><div class="eyebrow">Simuladores</div><h2>Laboratorios formativos por semana</h2></div>
    <div class="lab-list">${Object.entries(DATA.labs).map(([k, L]) => `<button type="button" class="row" data-labgo="${k}"><span class="n">SEMANA ${L.sem} · ${esc(L.dur)}</span><b>${esc(L.title)}</b><span class="foot">${esc(L.out)}</span></button>`).join('')}</div></section>
  <section id="rubricas" style="display:grid;gap:12px"><div class="sec-title" style="margin:0"><div class="eyebrow">Rúbricas analíticas</div><h2>Cómo se evalúa cada entrega</h2></div>
    <p class="foot">Fuente: documento oficial Evaluation Rubrics VIA6031. La rúbrica de cada actividad se publica en Blackboard antes de que empiece. La certificación SUJIS (semana 5) no tiene rúbrica en ese documento: su evidencia es el certificado.</p>
    ${DATA.rubrics.map(r => `<details class="rub" id="rub-${r.id}"><summary><span>${r.id} · ${esc(r.name)}</span><span class="badge">Semana ${r.sem} · ${r.peso}%</span></summary><div class="body"><p class="foot">Alineación: ${esc(r.al)}</p>${rubricTable(r)}</div></details>`).join('')}</section>
  <section class="card read" id="lecturas"><div class="sec-title"><div class="eyebrow">Lecturas fundamentales</div><h2>Texto guía y complementos</h2></div>
    <div class="grid2"><div><h3>Texto principal</h3><ul><li>${esc(LUCKIN)}</li></ul></div><div><h3>Complementarios</h3><ul><li>${esc(RUSSELL)} Referencia conceptual; es más técnico y no dirige la arquitectura pedagógica del curso.</li><li>UNESCO (2023). Marco ético y de gobernanza.</li></ul></div></div>
    <p class="foot" style="margin-top:12px">Herramienta: <a href="https://orangedatamining.com/" target="_blank" rel="noopener">Orange Data Mining</a></p></section>`;
}

function recalc() {
  const graded = DATA.plan.filter(p => p[3] > 0); let pts = 0, wsum = 0;
  graded.forEach((p, i) => { const v = parseFloat(grades[i]); if (!isNaN(v)) { pts += Math.min(100, Math.max(0, v)) * p[3] / 100; wsum += p[3]; } });
  const set = (id, t) => { const e = $(id); if (e) e.textContent = t; };
  set('#r-pts', fmt(pts));
  if (wsum) { const avg = pts / wsum * 100; set('#r-avg', fmt(avg) + '%'); set('#r-let', letter(avg)); } else { set('#r-avg', '–'); set('#r-let', '–'); }
  const rest = 100 - wsum;
  set('#r-need', !wsum ? '–' : rest ? (() => { const n = (94 - pts) / rest * 100; return n <= 0 ? 'Ya alcanzado' : n > 100 ? 'No alcanzable' : fmt(n) + ' en lo pendiente'; })() : (pts >= 94 ? 'Alcanzado' : 'No alcanzable'));
}

function route() {
  const r = parseHash(), view = $('#view');
  document.body.style.overflow = '';
  view.className = 'view'; void view.offsetWidth;
  view.innerHTML = r.v === 'semana' ? viewSemana(r.n) : r.v === 'recursos' ? viewRecursos() : r.v === 'producto' ? viewProducto() : viewInicio();
  $('#nav-inicio').setAttribute('aria-current', r.v === 'inicio' || r.v === 'semana' ? 'page' : 'false');
  $('#nav-producto').setAttribute('aria-current', r.v === 'producto' ? 'page' : 'false');
  $('#nav-recursos').setAttribute('aria-current', r.v === 'recursos' ? 'page' : 'false');
  renderSteps(r.v === 'semana' ? r.n : 0);
  if (r.v === 'recursos') recalc();
  window.scrollTo(0, 0);
}

function copyText(text, onOk, fallbackEl) {
  const fb = () => { if (fallbackEl) { fallbackEl.hidden = false; fallbackEl.value = text; fallbackEl.rows = 8; fallbackEl.style.width = '100%'; fallbackEl.select(); } onOk(false); };
  try { navigator.clipboard.writeText(text).then(() => onOk(true), fb); } catch (e) { fb(); }
}
let saveT;
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-w],[data-rub],[data-copy],[data-wscopy],[data-wsclear],[data-clo],[data-anchor],[data-labopen],[data-labfull],[data-labtab],[data-labgo]');
  if (!t) return;
  if (t.dataset.labopen) return labToggle(t.dataset.labopen);
  if (t.dataset.labfull) return labFull(t.dataset.labfull);
  if (t.dataset.labtab) return labTab(t.dataset.labtab);
  if (t.dataset.labgo) { const l = DATA.labs[t.dataset.labgo]; go('semana-' + l.sem); setTimeout(() => { const el = document.getElementById('lab-' + t.dataset.labgo); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 80); return; }
  if (t.dataset.w) return go('semana-' + t.dataset.w);
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.rub) {
    const open = () => { const d = document.getElementById('rub-' + t.dataset.rub); if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); } };
    if (parseHash().v !== 'recursos') { location.hash = 'recursos'; setTimeout(open, 60); } else open(); return;
  }
  if (t.dataset.anchor) { e.preventDefault(); const el = document.getElementById(t.dataset.anchor); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.dataset.clo) { cloFilter = t.dataset.clo; $('#align').innerHTML = alignHTML(); return; }
  if (t.dataset.copy) { copyText(t.dataset.copy, ok => { t.textContent = ok ? 'Copiado' : 'Selecciona y copia'; setTimeout(() => t.textContent = 'Copiar', 1800); }); return; }
  if (t.dataset.wscopy) { const id = t.dataset.wscopy, m = $('#wsmsg-' + id); copyText(wsText(id), ok => { m.textContent = ok ? 'Copiado.' : 'Tu navegador no permite copiar con el botón. Selecciona el texto de abajo y cópialo.'; }, $('#wsfallback-' + id)); return; }
  if (t.dataset.wsclear) {
    const id = t.dataset.wsclear;
    if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Confirmar: borrar todo'; return; }
    delete wsData[id]; lsSet('via6031:ws', wsData);
    document.querySelectorAll(`[data-ws="${id}"]`).forEach(x => x.value = ''); t.dataset.armed = '0'; t.textContent = 'Borrar mis respuestas'; $('#wsmsg-' + id).textContent = 'Respuestas borradas.';
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.ws) { (wsData[t.dataset.ws] = wsData[t.dataset.ws] || {})[t.dataset.k] = t.value; clearTimeout(saveT); saveT = setTimeout(() => lsSet('via6031:ws', wsData), 300); }
  else if (t.dataset.i !== undefined) { grades[t.dataset.i] = t.value; lsSet('via6031:grades', grades); recalc(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.type === 'checkbox' && t.dataset.k) { done[t.dataset.k] = t.checked; lsSet('via6031:done', done); const r = parseHash(); renderSteps(r.v === 'semana' ? r.n : 0); }
});
$('#nav-inicio').addEventListener('click', () => go('inicio'));
$('#nav-producto').addEventListener('click', () => go('producto'));
$('#nav-recursos').addEventListener('click', () => go('recursos'));
$('#theme-btn').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
});
route();
</script>
